[project]
name = "vfxglow"
version = "0.1.0"
description = "Pipeline VFX por capas: analiza el movimiento, genera un guion de efectos y compone capas HDR sobre el video original."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VFX Glow" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "mediapipe>=0.10.18,<0.11",
    "skia-python>=87.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "imageio-ffmpeg>=0.5",
    "certifi>=2024.0",
]

[project.optional-dependencies]
objects = ["ultralytics>=8.3"]
hq = ["ultralytics>=8.3", "rtmlib>=0.0.13", "onnxruntime>=1.17"]
masks = ["torch>=2.5", "sam-2"]
refiner = ["torch>=2.5", "diffusers>=0.30", "transformers>=4.44", "accelerate>=0.34"]
dev = ["pytest>=8.0", "httpx2>=2.0.0"]  # httpx2: el TestClient de starlette >= 1.10
train = ["ultralytics>=8.3"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "google-auth>=2.29", "requests>=2.31"]
scene = ["scenedetect>=0.6.4", "librosa>=0.10"]
# Nube (VEXORA_STORE=firestore, VEXORA_BLOBS=gcs): docs/despliegue_cloud_run.md
cloud = ["google-cloud-firestore>=2.16", "google-cloud-storage>=2.16", "google-cloud-run>=0.10"]

[project.scripts]
vfxglow = "vfxglow.cli:main"
vfxglow-train = "vfxglow.training.cli:main"
vfxglow-api = "vfxglow.api.server:main"
vexora-worker = "vfxglow.worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Archivos que no son .py y van dentro del paquete instalado (la imagen usa `pip install .`, no el
# modo editable): sin la marca SVG, el render en Cloud Run falla en compose.
[tool.setuptools.package-data]
vfxglow = ["py.typed", "composite/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
