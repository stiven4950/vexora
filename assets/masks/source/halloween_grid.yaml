# Cuadrícula de rostros de terror en neón (halloween_grid.png): 6 columnas x 4 filas de 256 px, con
# el nombre en una franja abajo de cada celda. tools/mask_from_grid.py saca de cada una sus trazos.
# Los nombres caen en lugares distintos según la fila: `rows_y` es la franja útil (y0, y1) de cada una.
# `marks`: dónde están los rasgos en la celda, leídos a mano de la imagen (cx, cy, rx, ry en píxeles);
# los ojos de neón son líneas finas que el detector de huecos no separa. Sin marcas se usan los huecos.
# Un rasgo con radio 0 no existe en el dibujo (el Alien no tiene ojos): solo sirve para ajustar a la cara.
