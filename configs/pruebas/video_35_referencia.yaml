# El lanzamiento de béisbol con un globo de agua.
- {seg: 25.4, accion: fast_swing, opcion: globo_agua, exacto: true, dur: 1.65}
- {seg: 27.2, accion: arms_open, opcion: bateria, exacto: true, dur: 1.7}
