# La coreografía de la referencia glowing/video_34.mp4, calcada momento a momento. Los tramos
# salen de la comparación cuadro a cuadro (tools/compare_reference.py: dónde y cuándo añadió luz
# el animador, por persona y parte del cuerpo) y el dibujo de cada uno, de la lectura en
# docs/referencias/video_34.md. Los tiempos son del original (la referencia se adelanta hasta 3
# cuadros al final). A = person_0 (traje claro), B = person_1 (saco rojo).
#   vfxglow run --video "../glowing/data/original/video_34 (1).mp4" --pin configs/pruebas/video_34_referencia.yaml
catalogo: baile_duo
solo_estos: true
momentos:
# --- Entrada: aro en la frente y ojos de corazón (A hasta 3,4 s; B hasta 2,67 s).
- {seg: 0.0, accion: entrance, opcion: aureola, persona: person_0, espejo: false, exacto: true, dur: 3.4}
- {seg: 0.0, accion: entrance, opcion: aureola, persona: person_1, espejo: false, exacto: true, dur: 2.67}
# A: el borde del saco y un aro en la muñeca. B: corazón en la mano.
- {seg: 0.0, opcion: solapa, persona: person_0, espejo: false, exacto: true, dur: 1.55}
- {seg: 0.5, opcion: aro_muneca, persona: person_0, espejo: false, exacto: true, dur: 1.5}
- {seg: 0.95, opcion: corazon_mano, persona: person_1, lado: left, espejo: false, exacto: true, dur: 0.65}
- {seg: 2.15, opcion: aro_muneca, persona: person_0, espejo: false, exacto: true, dur: 0.25}
# --- 3,3-5,0: B, la rosa y luego el remolino; A, el lazo al cuello y luego un remolino en el pecho.
- {seg: 3.3, opcion: rosa, persona: person_1, lado: left, espejo: false, exacto: true, dur: 1.7}
- {seg: 3.95, opcion: remolino, persona: person_1, lado: right, espejo: false, exacto: true, dur: 1.05}
- {seg: 3.45, opcion: lazo, persona: person_0, espejo: false, exacto: true, dur: 0.75}
- {seg: 4.1, opcion: remolino, persona: person_0, lado: left, espejo: false, exacto: true, dur: 0.9}
# --- 5,2-7,0: notas de las manos de los dos y luego una nota grande.
- {seg: 5.2, opcion: notas, espejo: true, exacto: true, dur: 0.95}
- {seg: 6.3, opcion: nota_grande, espejo: true, exacto: true, dur: 0.65}
# --- 7,2-7,9: rayos por hombros y brazos de los dos.
- {seg: 7.2, opcion: rayos_brazos, espejo: true, exacto: true, dur: 0.7}
# --- 8,3-10,6: A, destello y corazones en la mano, ojos y un aro alrededor del pie. B, rayos en
# los brazos, sobre la cabeza y el borde del saco.
- {seg: 8.27, opcion: aro_muneca, persona: person_0, espejo: false, exacto: true, dur: 0.15}
- {seg: 8.47, opcion: corazon_mano, persona: person_0, lado: right, espejo: false, exacto: true, dur: 1.3}
