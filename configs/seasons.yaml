# Temporadas: la época entra DENTRO de los efectos que ya se disparan, no como un marco fijo.
# Se aplican encima de cualquier catálogo (`--season <id>` o el paso "Toque de temporada" de la
# web). Cada temporada:
# - months / days: cuándo se sugiere (mes 1-12; días opcionales "MM-DD" de inicio y fin).
# - palette: sustituye la paleta del catálogo (los capítulos de color toman de aquí).
# - particles: objetos que reemplazan a las partículas (gotas, chispas) de los efectos.
# - hats: sombreros que reemplazan a los de los accesorios de cabeza.
# - closing: objeto en que se disipa todo al final (en vez de estrellas).
# - moments: momentos de temporada como opción más de una acción del catálogo (`action`), con su
#   peso; compiten con las demás y respetan al protagonista y el tope de efectos.
# - boost: opciones del catálogo que salen más, por su nombre.
seasons:
- id: halloween
  title: Halloween
  emoji: "🎃"
  months: [10]
  tags: [halloween, terror, calabazas, arañas, telarañas, murciélagos, fantasmas]
  description: Murciélagos que salen de los golpes, una araña que baja en las pausas, fantasmas al pisar y sombrero de bruja.
  palette:
  - [1.0, 0.5, 0.05]
  - [0.6, 0.2, 1.0]
  - [0.45, 1.0, 0.15]
  - [1.0, 0.35, 0.1]
  particles: [bat, pumpkin, ghost, spider]
  hats: [witch_hat]
  closing: [bat, pumpkin]
  moments:
  - {action: still, moment: spider_drop, weight: 0.6, size: 2.5}
  - {action: lull, moment: web_corner, weight: 0.5, size: 2.0}
  - {action: frenzy, moment: bat_swarm, weight: 0.8, size: 1.4}
  - {action: stomp, moment: ghost_rise, weight: 0.6, size: 1.6}
  - {action: fast_swing, moment: bat_swarm, weight: 0.25, size: 1.0}
  # Objetos en imagen (configs/sprites/halloween/, sacados de la hoja de assets): se combinan con
  # los dibujos de líneas de arriba y salen pocas veces por video.
  - {action: fast_swing, sprite: halloween/claw_scratches.png, motion: [pop, orient, fade], scale: 0.9, weight: 0.25, size: 0.8}
  - {action: fast_swing, sprite: halloween/bat_swarm.png, motion: [fly, fade], scale: 1.0, weight: 0.2, size: 1.2}
  - {action: jump, sprite: halloween/bat_swarm.png, motion: [fly, fade], scale: 1.2, weight: 0.4, size: 1.2}
  - {action: lunge, sprite: halloween/energy_trail.png, motion: [pop, orient, fade], scale: 1.0, weight: 0.2, size: 0.8}
  - {action: stomp, sprite: halloween/ghost.png, motion: [pop, rise, sway, fade], scale: 1.2, weight: 0.4, size: 1.6}
  - {action: landing, sprite: halloween/smoke_cloud.png, target: mid_hip, motion: [floor, pop, fade], scale: 1.0, weight: 0.35, size: 1.0}
  - {action: impact, sprite: halloween/slime.png, motion: [pop, fade], scale: 0.7, weight: 0.25, size: 0.8}
  - {action: impact, sprite: halloween/burst.png, motion: [pop, spin, fade], scale: 0.8, weight: 0.25, size: 0.6}
  - {action: spin_body, sprite: halloween/portal.png, target: mid_hip, motion: [floor, flat, pop, spin, fade], scale: 1.8, weight: 0.4, size: 1.2}
  - {action: frenzy, sprite: halloween/rune_sigil.png, target: mid_hip, motion: [floor, flat, pop, spin, fade], scale: 1.6, weight: 0.35, size: 1.4, max_uses: 1}
  - {action: arms_up, sprite: halloween/moon.png, target: nose, motion: [above, pop, rise, fade], scale: 1.0, weight: 0.3, size: 1.6, max_uses: 1}
  - {action: raise_hand, sprite: halloween/zombie_hand.png, target: mid_hip, motion: [floor, rise, fade], scale: 1.0, weight: 0.25, size: 1.4, max_uses: 1}
  - {action: heart_hands, sprite: halloween/candle.png, motion: [pop, sway], scale: 0.8, weight: 0.4, size: 1.6, max_uses: 1}
  - {action: hands_on_head, sprite: halloween/skull_flames.png, target: nose, motion: [pop, fade], scale: 0.7, weight: 0.3, size: 1.2, max_uses: 1}
  # Cabeza de calabaza en una pausa, ojos que flotan en la oscuridad y sombrero de bruja puesto.
  - {action: still, sprite: halloween/pumpkin.png, target: nose, motion: [pop, sway], scale: 0.55, weight: 0.25, size: 2.0, max_uses: 1}
  - {action: still, sprite: halloween/eyes.png, target: nose, motion: [above, pop, fade], scale: 1.0, weight: 0.15, size: 1.6, max_uses: 1}
  - {action: still, sprite: halloween/witch_hat.png, target: nose, motion: [hat, pop], scale: 0.6, weight: 0.2, size: 2.0, max_uses: 1}
  - {action: lull, sprite: halloween/corner_cobweb.png, target: nose, motion: [corner, pop], scale: 1.6, weight: 0.4, size: 2.0, max_uses: 1}
  boost: [rayos_x, expresion]
