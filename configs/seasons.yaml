# Temporadas: la época entra DENTRO de los efectos que ya se disparan, no como un marco fijo.
# Se aplican encima de cualquier catálogo (`--season <id>` o el paso "Toque de temporada" de la
# web). Cada temporada:
# - months / days: cuándo se sugiere (mes 1-12; días opcionales "MM-DD" de inicio y fin).
# - palette: sustituye la paleta del catálogo (los capítulos de color toman de aquí).
# - particles: objetos que reemplazan a las partículas (gotas, chispas) de los efectos.
# - hats: sombreros que reemplazan a los de los accesorios de cabeza.
# - closing: objeto en que se disipa todo al final (en vez de estrellas).
# - moments: momentos de temporada como opción más de una acción del catálogo (`action`), con su
#   peso; compiten con las demás y respetan al protagonista y el tope de efectos.
# - boost: opciones del catálogo que salen más, por su nombre.
seasons:
- id: halloween
  title: Halloween
  emoji: "🎃"
  months: [10]
  tags: [halloween, terror, calabazas, arañas, telarañas, murciélagos, fantasmas]
  description: La mano suelta murciélagos, los golpes dejan arañazos, un fantasma sale del piso al pisar, la cabeza se vuelve calabaza en una pausa, una araña baja de su hilo y las hadas vuelan alrededor.
  palette:
  - [1.0, 0.5, 0.05]
  - [0.6, 0.2, 1.0]
  - [0.45, 1.0, 0.15]
  - [1.0, 0.35, 0.1]
  particles: [bat, pumpkin, ghost, spider]
  hats: [witch_hat]
  closing: [bat, pumpkin]
  # Cada objeto es la consecuencia de lo que hace la persona (dibujos de engine/season.py según
  # las figuras de glowing_assets): soltar algo libera murciélagos, un tajo deja arañazos, pisar
  # fuerte despierta un fantasma, quedarse quieto de frente la vuelve calabaza, y si se queda
  # quieta mucho rato la araña baja y crecen telarañas.
  moments:
  - {action: fast_swing, moment: claw_slash, weight: 0.3, size: 0.8, max_uses: 3}
  - {action: fast_swing, moment: bat_release, weight: 0.2, size: 1.4, max_uses: 2}
  - {action: arms_open, moment: bat_release, weight: 0.6, size: 1.6, max_uses: 2}
  - {action: throw, moment: bat_release, weight: 0.5, size: 1.6, max_uses: 2}
  - {action: frenzy, moment: bat_swarm, weight: 0.6, size: 1.4, max_uses: 1}
  - {action: stomp, moment: ghost_rise, weight: 0.5, size: 1.8, max_uses: 2}
  - {action: still, moment: pumpkin_head, weight: 0.7, size: 2.2, max_uses: 1}
  - {action: still, moment: spider_drop, weight: 0.4, size: 2.5, max_uses: 1}
  - {action: lull, moment: web_corner, weight: 0.5, size: 2.0, max_uses: 1}
  # Rostros de terror en neón sobre la cara (assets/masks, engine/horror_masks.py): al empezar, en
  # una pausa o al abrir la boca (el grito). `terror`: se sortea uno de los 24 por activación.
  # Aparecen en ~0,8 s y se sueltan en polvo en ~1,1 s.
  # Al empezar casi siempre sale el rostro: es lo que define el modo Halloween.
  - {action: entrance, moment: terror, weight: 12.0, size: 2.4, max_uses: 1}
  - {action: still, moment: terror, weight: 5.0, size: 2.4, max_uses: 2}
  - {action: mouth_open, moment: terror, weight: 1.5, size: 2.4, max_uses: 2}
  - {action: blink, moment: terror, weight: 0.3, size: 2.4, max_uses: 1}
  # Hadas que vuelan alrededor de la persona en oleadas (engine/head_beasts.py).
  ambient:
  - type: adornment
    target: {kind: joint, id: body}
    time: {start_frame: 0, end_frame: -1, fade_in: 2, fade_out: 4}
    style: {shapes: [fairies], thickness: 0.006, hdr_gain: 1.6, focus: false, keep_on_cut: true}
    render: {blend: add, motion_blur: 0.0, persistence: 0.0, group: glow}
  boost: [rayos_x, expresion, mascara_terror, aranas, hormigas, ciempies, cucarachas, zarpazo, cicatriz, grietas, balaca_serpientes, corona_serpientes, cachos_rojos, gancho_muerte, esqueletos]
