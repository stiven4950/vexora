# Temporadas: estilos de época que se aplican encima de cualquier catálogo (`--season <id>` o el
# selector de la web). Cada temporada:
# - months / days: cuándo se sugiere (mes 1-12; días opcionales "MM-DD" de inicio y fin).
# - palette: sustituye la paleta del catálogo (los capítulos de color toman de aquí).
# - decor: formas de season_fx (engine/season.py) que decoran todo el video.
# - boost: opciones del catálogo que salen más (peso x boost_factor), por su nombre.
# - tags: etiquetas para buscar y mostrar.
seasons:
- id: halloween
  title: Halloween
  emoji: "🎃"
  months: [10]
  tags: [halloween, terror, calabazas, arañas, telarañas, murciélagos, fantasmas]
  description: Calabazas, arañas y telarañas, murciélagos y fantasmas en naranja, morado y verde ácido.
  palette:
  - [1.0, 0.5, 0.05]
  - [0.6, 0.2, 1.0]
  - [0.45, 1.0, 0.15]
  - [1.0, 0.35, 0.1]
  decor: [cobweb, spider, bats, pumpkins, ghosts]
  boost: [rayos_x, expresion, cabeza_accesorio, discoteca]
- id: dia_de_muertos
  title: Día de Muertos
  emoji: "💀"
  months: [11]
  days: ["10-28", "11-03"]
  tags: [día de muertos, calaveras, cempasúchil, catrina, ofrenda]
  description: Calaveras con ojos de flor y pétalos de cempasúchil en naranja, magenta y turquesa.
  palette:
  - [1.0, 0.6, 0.0]
  - [1.0, 0.15, 0.6]
  - [0.1, 0.85, 0.85]
  - [0.65, 0.25, 1.0]
  decor: [skull, marigolds]
  boost: [rayos_x, cabeza_accesorio]
- id: navidad
  title: Navidad
  emoji: "🎄"
  months: [12]
  tags: [navidad, nieve, esferas, estrella, invierno]
  description: Nieve, esferas que cuelgan y una estrella que corona, en rojo, verde y dorado.
  palette:
  - [1.0, 0.15, 0.15]
  - [0.15, 0.9, 0.35]
  - [1.0, 0.8, 0.25]
  - [0.85, 0.95, 1.0]
  decor: [snow, ornaments, star]
  boost: [cabeza_accesorio, collar_estrellas]
- id: ano_nuevo
  title: Año Nuevo
  emoji: "🎆"
  months: [12, 1]
  days: ["12-28", "01-03"]
  tags: [año nuevo, fuegos artificiales, fiesta, brindis]
  description: Fuegos artificiales y fiesta en dorado, plata y magenta.
  palette:
  - [1.0, 0.82, 0.3]
  - [0.85, 0.9, 1.0]
  - [1.0, 0.3, 0.75]
  - [0.4, 0.7, 1.0]
  decor: [fireworks]
  boost: [discoteca, bola_espejos, ecualizador, fiesta]
- id: san_valentin
  title: San Valentín
  emoji: "💘"
  months: [2]
  days: ["02-01", "02-15"]
  tags: [san valentín, amor, corazones, romántico]
  description: Corazones que suben en rosa, rojo y lila.
  palette:
  - [1.0, 0.3, 0.55]
  - [1.0, 0.1, 0.25]
  - [0.85, 0.5, 1.0]
  - [1.0, 0.7, 0.8]
  decor: [hearts]
  boost: [beso, corazon]
