      style: {shapes: [shock], thickness: 0.012}
      trigger: {hold: 60, fade_in: 1, fade_out: 6}
  - name: nada
    weight: 0.2
    effects: []
# Se tapa los ojos: antifaz o la cara de burla al destaparse.
- action: cover_eyes
