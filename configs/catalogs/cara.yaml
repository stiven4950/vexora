  - name: mascara_terror
    weight: 0.15
    cooldown: 600
    effects:
    - type: adornment
      style: {shapes: [terror_ghostface], thickness: 0.008, focus: false}
      trigger: {hold: 150, fade_in: 1, fade_out: 6}
  - name: runas
    weight: 0.3
    cooldown: 300
    effects:
    - type: adornment
      style: {shapes: [face_runes], thickness: 0.008, focus: false}
      trigger: {hold: 90, fade_in: 1, fade_out: 6}
  - name: circuito
    weight: 0.25
    cooldown: 300
    effects:
    - type: adornment
      style: {shapes: [face_circuit], thickness: 0.008, focus: false}
      trigger: {hold: 90, fade_in: 1, fade_out: 6}
  - name: cristal
