# Cara: efectos glowing sobre el rostro (unifica los presets face_neon y face_runes).
#
# Solo luz sobre la cara real (sin deformarla ni cambiarle la piel). Reacciona a lo que hace la cara:
# expresiones y cabeza (analysis/expressions.py: boca abierta, parpadeo, guiño, ojos muy abiertos,
# sonrisa, cejas, mejillas, beso, giro e inclinación), trazos de maquillaje (paint_stroke, con la
# figura que más se parece al trazo) y la punta del pincel (tool_touch), y los gestos de las manos
# en la cara. Dibujos en engine/face_glow.py; se suman máscaras y gafas de engine/face_toon.py,
# eyewear.py y costumes.py. Sin video de referencia todavía (docs/referencias/cara.md).
name: cara
title: Cara neón
subtitle: Rostro y maquillaje
description: 'Para videos de cara: delineado, geometría, malla, cristal, circuitos y runas sobre el rostro; los ojos lanzan rayos, la boca abierta carga energía, al parpadear aparece una máscara y el maquillaje se vuelve figuras de luz.'
tags: [cara, rostro, maquillaje, retrato, selfie]
seed: 17
# Ningún tramo de más de 1,2 s sin efecto.
max_gap_s: 2.0
chapters: true
# Un dibujo nuevo, un color nuevo.
color_per_effect: true
# Los rostros y dibujos de la cara se quedan: los momentos de temporada (la máscara de Halloween)
# duran 3 veces lo de seasons.yaml.
moment_scale: 3.0
defaults:
  type: adornment
  target: {kind: joint, id: body}
  time: {start_frame: 0, end_frame: -1, fade_in: 2, fade_out: 4}
  style:
    thickness: 0.008
    hdr_gain: 1.5
    # Lo que se pega a la cara sigue en la toma siguiente (facil_1 tiene cortes cada 1-2 s).
    keep_on_cut: true
    palette:
    - [0.2, 1.0, 0.9]
    - [1.0, 0.3, 0.8]
    - [0.55, 0.4, 1.0]
    - [1.0, 0.85, 0.2]
    - [0.35, 1.0, 0.4]
    - [1.0, 0.5, 0.3]
  render: {blend: add, motion_blur: 0.0, persistence: 0.0, group: glow}
always:
- type: closing_stars
  style: {size: 1.0, hdr_gain: 1.8, focus: false}
reactions:
# Al empezar: el contorno de la cara se traza solo, o un barrido holográfico.
- action: entrance
  options:
  # Rostro de terror en neón (assets/masks, engine/horror_masks.py): se arma sobre la cara y grita
  # con la boca. Sale más en la temporada de Halloween.
  - name: mascara_terror
    weight: 0.15
    cooldown: 600
    effects:
    - type: adornment
      style: {shapes: [terror_ghostface], thickness: 0.008, focus: false}
      trigger: {hold: 150, fade_in: 1, fade_out: 6}
  - name: contorno
    weight: 0.5
    cooldown: 0
    effects:
    - type: adornment
      style: {shapes: [face_oval_trace], thickness: 0.008, focus: false}
      trigger: {hold: 120, fade_in: 1, fade_out: 6}
  - name: escaner
    weight: 0.5
    cooldown: 0
    effects:
    - type: adornment
      style: {shapes: [face_scan], thickness: 0.008, focus: false}
      trigger: {hold: 120, fade_in: 1, fade_out: 6}
# Lo que más se mueve es la cabeza, o la persona está quieta: dibujos sobre el rostro.
- action: spotlight
  options:
  - name: delineado
    weight: 0.35
    cooldown: 240
    kinds: [head]
    effects:
    - type: adornment
      style: {shapes: [liner_trace], thickness: 0.008, focus: false}
      trigger: {hold: 72, fade_in: 1, fade_out: 6}
  - name: geometria
    weight: 0.3
    cooldown: 240
    kinds: [head]
    effects:
    - type: adornment
      style: {shapes: [face_geometry], thickness: 0.008, focus: false}
      trigger: {hold: 72, fade_in: 1, fade_out: 6}
  - name: malla
    weight: 0.25
    cooldown: 240
    kinds: [head]
    effects:
    - type: adornment
      style: {shapes: [face_mesh_live], thickness: 0.008, focus: false}
      trigger: {hold: 72, fade_in: 1, fade_out: 6}
  - name: cristal
    weight: 0.2
    cooldown: 240
    kinds: [head]
    effects:
    - type: adornment
      style: {shapes: [face_crystal], thickness: 0.008, focus: false}
      trigger: {hold: 72, fade_in: 1, fade_out: 6}
  - name: circuito
    weight: 0.25
    cooldown: 240
    kinds: [head]
    effects:
    - type: adornment
      style: {shapes: [face_circuit], thickness: 0.008, focus: false}
      trigger: {hold: 72, fade_in: 1, fade_out: 6}
  - name: runas
    weight: 0.3
    cooldown: 240
    kinds: [head]
    effects:
    - type: adornment
      style: {shapes: [face_runes], thickness: 0.008, focus: false}
      trigger: {hold: 72, fade_in: 1, fade_out: 6}
  - name: aro_runas
    weight: 0.2
    cooldown: 240
    kinds: [head]
    effects:
    - type: adornment
      style: {shapes: [rune_orbit], thickness: 0.008, focus: false}
      trigger: {hold: 72, fade_in: 1, fade_out: 6}
  - name: eco_cabeza
    weight: 0.15
    cooldown: 240
    kinds: [head]
    effects:
    - type: adornment
      style: {shapes: [head_echo], thickness: 0.008, focus: false}
      trigger: {hold: 72, fade_in: 1, fade_out: 6}
  - name: escaner
    weight: 0.15
    cooldown: 240
    kinds: [head]
    effects:
    - type: adornment
      style: {shapes: [face_scan], thickness: 0.008, focus: false}
      trigger: {hold: 72, fade_in: 1, fade_out: 6}
  - name: llamas_ojos
    weight: 0.15
    cooldown: 240
    kinds: [head]
    effects:
    - type: adornment
      style: {shapes: [eye_flames], thickness: 0.008, focus: false}
      trigger: {hold: 72, fade_in: 1, fade_out: 6}
  - name: gafas
    weight: 0.2
    cooldown: 300
    kinds: [head]
    effects:
    - type: eyewear
      target: {kind: joint, id: nose}
      style: {thickness: 0.07, shapes: [frames, stars, hearts, visor, rings]}
      trigger: {hold: 60, fade_in: 1, fade_out: 6}
- action: still
