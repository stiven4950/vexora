# Cara: efectos glowing sobre el rostro (unifica los presets face_neon y face_runes).
#
# Solo luz sobre la cara real (sin deformarla ni cambiarle la piel). Reacciona a lo que hace la cara:
# expresiones y cabeza (analysis/expressions.py: boca abierta, parpadeo, guiño, ojos muy abiertos,
# sonrisa, cejas, mejillas, beso, impresión, mirada, giro e inclinación), trazos de maquillaje (paint_stroke, con la
# figura que más se parece al trazo) y la punta del pincel (tool_touch), y los gestos de las manos
# en la cara. Dibujos en engine/face_glow.py; se suman máscaras y gafas de engine/face_toon.py,
# eyewear.py y costumes.py. Sin video de referencia todavía (docs/referencias/cara.md).
name: cara
title: Cara neón
subtitle: Rostro y maquillaje
description: 'Para videos de cara: delineado, geometría, malla, cristal, circuitos y runas sobre el rostro; los ojos lanzan rayos, la boca abierta carga energía, al parpadear aparece una máscara y el maquillaje se vuelve figuras de luz.'
tags: [cara, rostro, maquillaje, retrato, selfie]
seed: 17
# Ningún tramo de más de 1,2 s sin efecto.
max_gap_s: 2.0
# Alrededor de la persona, cada ~3 s, además del efecto de la cara (ver la acción `ambient`).
ambient_every_s: 3.0
# Un efecto largo cada ~8 s (ver la acción `look`).
look_every_s: 8.0
chapters: true
# Un dibujo nuevo, un color nuevo.
color_per_effect: true
# Un solo efecto a la vez sobre el rostro.
one_at_a_time: true
# Orden de reparto con un efecto a la vez: primero lo que no cabe en cualquier lado (el rostro de
# entrada y los efectos largos de las pausas), luego los gestos clave y al final la mirada, que es
# corta y llena los huecos. Con la mirada antes, sus ráfagas no dejaban lugar a los largos.
priority: [entrance, still, surprise, frown, pucker, mouth_open, eyes_wide, speaking, gaze_shift, wink]
defaults:
  type: adornment
  target: {kind: joint, id: body}
  time: {start_frame: 0, end_frame: -1, fade_in: 2, fade_out: 4}
  style:
    thickness: 0.008
    hdr_gain: 1.5
    # Lo que se pega a la cara sigue en la toma siguiente (facil_1 tiene cortes cada 1-2 s).
    keep_on_cut: true
    palette:
    - [0.2, 1.0, 0.9]
    - [1.0, 0.3, 0.8]
    - [0.55, 0.4, 1.0]
    - [1.0, 0.85, 0.2]
    - [0.35, 1.0, 0.4]
    - [1.0, 0.5, 0.3]
  render: {blend: add, motion_blur: 0.0, persistence: 0.0, group: glow}
always:
- type: closing_stars
  style: {size: 1.0, hdr_gain: 1.8, focus: false}
reactions:
# Al empezar: el contorno de la cara se traza solo, o un barrido holográfico.
- action: entrance
  options:
  # Partículas que salen del rostro o lo rodean: lo que más sale.
  - name: particulas_salen
    weight: 0.8
    cooldown: 120
    effects:
    - type: adornment
      style: {shapes: [face_emanate], thickness: 0.008, focus: false}
      trigger: {hold: 90, fade_in: 1, fade_out: 8}
  - name: remolino
    weight: 0.8
    cooldown: 120
    effects:
    - type: adornment
      style: {shapes: [face_swirl], thickness: 0.008, focus: false}
      trigger: {hold: 90, fade_in: 1, fade_out: 8}
  # Rostro de terror en neón (assets/masks, engine/horror_masks.py): se arma sobre la cara y grita
  # con la boca. Sale más en la temporada de Halloween.
  - name: mascara_terror
    weight: 0.15
    cooldown: 600
    effects:
    - type: adornment
      # Los 24 rostros (se sortea uno por activación).
      style: {shapes: &terror [terror_alien, terror_billy_saw, terror_calabaza, terror_chica_poseida, terror_chucky, terror_demonio, terror_dracula, terror_espantapajaros, terror_espectro, terror_frankenstein, terror_freddy_krueger, terror_ghostface, terror_hannibal_lecter, terror_hombre_lobo, terror_jason_voorhees, terror_michael_myers, terror_momia, terror_nosferatu, terror_novia_frankenstein, terror_payaso_maldito, terror_pennywise, terror_predator, terror_rey_infierno, terror_vampiro], thickness: 0.008, focus: false}
      trigger: {hold: 72, fade_in: 1, fade_out: 6}
  - name: contorno
    weight: 0.5
    cooldown: 0
    effects:
    - type: adornment
      style: {shapes: [face_oval_trace], thickness: 0.008, focus: false}
      trigger: {hold: 120, fade_in: 1, fade_out: 6}
  - name: escaner
    weight: 0.5
    cooldown: 0
    effects:
    - type: adornment
      style: {shapes: [face_scan], thickness: 0.008, focus: false}
      trigger: {hold: 120, fade_in: 1, fade_out: 6}
