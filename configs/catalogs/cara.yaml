# Un trazo de maquillaje: su figura se traza, gira, se itera y queda como cristal.
- action: paint_stroke
  options:
  - name: figura_maquillaje
    weight: 0.7
    cooldown: 60
    effects:
    - type: adornment
      style: {shapes: [makeup_figure], thickness: 0.008, focus: false}
      trigger: {hold: 108, fade_in: 1, fade_out: 6}
  - name: delineado
    weight: 0.3
    cooldown: 120
    effects:
    - type: adornment
      style: {shapes: [liner_trace], thickness: 0.008, focus: false}
      trigger: {hold: 72, fade_in: 1, fade_out: 6}
# La punta del pincel deja pigmento: llama en la punta (lo de face_neon).
- action: tool_touch
  options:
  - name: llama_pincel
    weight: 0.6
    cooldown: 60
    effects:
    - type: tip_flame
      target: {kind: event_point, id: tool_touch}
      style: {thickness: 0.02, hdr_gain: 1.6}
      render: {persistence: 0.35, glow_layers: 2}
      trigger: {hold: 45, fade_in: 1, fade_out: 6}
  - name: nada
    weight: 0.4
    effects: []
# Mano en la cara: el beso con jalón o la cara de asombro.
- action: face_touch
  options:
  - name: beso
    weight: 0.5
    cooldown: 300
    effects:
    - type: face_toon
      style: {shapes: [kiss], thickness: 0.012}
      trigger: {hold: 45, fade_in: 1, fade_out: 6}
  - name: asombro
    weight: 0.3
    cooldown: 300
    effects:
