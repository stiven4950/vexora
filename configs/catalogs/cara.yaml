  - name: medusa
    weight: 0.4
    cooldown: 300
    effects:
    - type: adornment
      style: {shapes: [medusa_snakes], thickness: 0.008, focus: false}
      trigger: {hold: 105, fade_in: 1, fade_out: 3}
  # El giro sopla el polvo y el humo del rostro.
  - name: desintegracion
    weight: 0.35
    cooldown: 300
    effects:
    - type: adornment
      style: {shapes: [face_dissolve], thickness: 0.008, focus: false}
      trigger: {hold: 90, fade_in: 1, fade_out: 3}
  # Serpiente holográfica alrededor de la cabeza.
