# Baile: un solo estilo para una persona o para dos (referencias glowing/video_33.mp4, solista, y
# glowing/video_34.mp4, pareja; ver docs/catalogo_efectos.md, sección "Baile").
#
# - Lo que más se mueve se enciende (spotlight): tinte pegado a la silueta, línea casi blanca y
#   halo, a veces abdominales o bíceps; en las pausas, accesorios dibujados; la gorra como objeto.
# - Los dibujos leídos de video_34 (rosas, cintas, alma, rayos, discos, arcos 3D, cresta punk,
#   notas y corazones...) vienen de _baile_compartido.yaml.
# - Con una persona, el color cambia por capítulo. Con dos (duet), cada una lleva su color todo el
#   video (`colors`): al unísono lo que se enciende en una se copia a la otra; en un solo, solo
#   se enciende quien lo lleva (analysis/duet.py, director/choreography.py).
name: baile
title: Baile neón
subtitle: Solo o en pareja
description: 'Para una persona o para dos: lo que más se mueve se enciende, rosas, cintas, notas y corazones, rayos y arcos 3D; en pareja, cada uno con su color y lo que hace uno se enciende en el otro cuando bailan igual.'
tags: [baile, solista, pareja, dúo, fiesta]
# Con dos personas: el color de cada una (persona 1, persona 2).
colors:
- [0.2, 0.85, 1.0]
- [1.0, 0.35, 0.7]
# Pareja (analysis/duet.py): espejo al unísono, turnos en los solos. Con una persona no hace nada.
duet: true
# Ningún tramo de más de 1 s sin efecto (director/choreography.py: fill_gaps).
max_gap_s: 1.0
seed: 33
# La gorra que pasa de mano en mano (seg. 0-9 de la referencia) es el objeto protagonista: se
# sigue con Grounding DINO + SAM 2 (lento: ~1,2 s por fotograma en MPS, queda en caché).
needs: [props]
prop: a baseball cap. a hat.
# Color por capítulo (como la referencia): gorra y parte del cuerpo encendida comparten color, y
# el color solo cambia cuando cambia el foco.
chapters: true
# video_52: un dibujo nuevo, un color nuevo.
color_per_effect: true
# Nada compite con el protagonista: lo que no está en foco se apaga (línea de atención).
attention: true
# Dibujos de video_34 (configs/catalogs/_baile_compartido.yaml), a un peso que deja espacio a los
# efectos de cuerpo y accesorios.
include: [{name: _baile_compartido, weight: 0.75}]
defaults:
  type: body_glow
  target: {kind: joint, id: body}
  time: {start_frame: 0, end_frame: -1, fade_in: 2, fade_out: 4}
  style:
    thickness: 0.018
    hdr_gain: 1.7
    boil_frames: 3
    fill: 0.6
    palette:
    - [0.35, 1.0, 0.2]
    - [1.0, 0.25, 0.85]
    - [0.2, 1.0, 0.85]
    - [1.0, 0.92, 0.15]
    - [0.55, 0.35, 1.0]
    - [1.0, 0.45, 0.65]
  render: {blend: add, motion_blur: 0.0, persistence: 0.0, group: glow}
always:
# Seg. 29: en el último segundo todo se disipa en estrellas diminutas donde estaba.
- type: closing_stars
  style: {size: 1.0, hdr_gain: 1.8, focus: false}
# Seg. 26.6-27.4: la gorra lanzada o sacudida deja una mancha grande en forma de coma.
- type: prop_swoosh
  style: {min_speed: 0.09, size: 0.9, trail_frames: 10, palette_every: 30}
# Mientras está en las manos o en el aire, la gorra va teñida y con contorno de neón.
- type: prop_outline
  style: {shapes: [no_outline], fill: 0.85, palette_every: 30}
  render: {blend: tint}
- type: prop_outline
  style: {fill: 0.0, palette_every: 30}
reactions:
# Al empezar: un aro en la frente y ojos de corazón, o un disfraz de cara (en pareja, en los dos).
- action: entrance
  options:
  - name: aureola
    weight: 0.4
    effects:
    - type: adornment
      style: {shapes: [head_ring], thickness: 0.012, focus: false}
      trigger: {hold: 70, fade_in: 4, fade_out: 12}
    - type: adornment
      style: {shapes: [heart_eyes], thickness: 0.008, focus: false}
      trigger: {hold: 70, fade_in: 4, fade_out: 12}
  - name: antifaz_entrada
    weight: 0.3
    effects:
    - type: adornment
      style: {shapes: [hero_mask, masquerade, bat_mask, cat_mask, fox_mask], thickness: 0.009, focus: false}
      trigger: {hold: 70, fade_in: 4, fade_out: 12}
  - name: ocurrencia_entrada
    weight: 0.3
    effects:
    - type: adornment
      style: {shapes: [bunny, horns, antennae, ninja_band, mustache], thickness: 0.009, focus: false}
      trigger: {hold: 70, fade_in: 4, fade_out: 12}
- action: spotlight
  options:
  - name: brazo
    weight: 0.6
    kinds: [left_arm, right_arm]
    effects:
    - type: body_glow
      trigger: &id001 {hold: 4, fade_in: 3, fade_out: 6}
      style:
        shapes: [no_outline]
        fill: 0.85
      render: {blend: tint}
    - type: body_glow
      style:
        shapes: [biceps]
        fill: 0.0
      trigger: *id001
  # Pierna entera encendida: poco (criterio P7, mejor trazos parciales).
  - name: piernas
    weight: 0.15
    kinds: [legs, feet]
    effects:
    - type: body_glow
      trigger: &id002 {hold: 4, fade_in: 3, fade_out: 6}
      style:
        shapes: [no_outline]
        fill: 0.85
      render: {blend: tint}
    - type: body_glow
      trigger: *id002
      style: {fill: 0.0}
  # Solo las líneas internas de los abdominales, sin el relleno ni el contorno del torso: la caja
  # completa se leía como una figura geométrica (dance_two_mens, seg. 30).
  - name: torso_abdominales
    weight: 0.3
    kinds: [torso, left_arm, right_arm]
    effects:
    - type: body_glow
      target: &id003 {kind: joint, id: torso}
      style:
        shapes: [abs, lines_only]
        fill: 0.0
      trigger: &id004 {hold: 4, fade_in: 3, fade_out: 6}
  # Seg. 14.6: no siempre la caja completa; a veces unas pocas líneas sueltas del pecho. De
  # espaldas, músculos de la espalda o una figura de relleno (seg. 18.6: símbolo radiactivo).
  - name: torso_lineas
    weight: 0.3
    kinds: [torso, left_arm, right_arm]
    effects:
    - type: body_glow
      target: {kind: joint, id: torso}
      style:
        shapes: [abs, partial, lines_only]
        fill: 0.0
      trigger: {hold: 4, fade_in: 3, fade_out: 6}
  # Seg. 15: aros que suben por el brazo casi hasta el hombro y regresan; en las piernas igual.
  - name: aros
    weight: 0.3
    kinds: [left_arm, right_arm, legs]
    effects:
    - type: limb_rings
      style: {rings: 2, trail_frames: 14, thickness: 0.014}
      trigger: {hold: 4, fade_in: 2, fade_out: 5}
  # Seg. 23.9-24.7: no la pierna entera, solo tramos del contorno que suben como una onda.
  - name: piernas_onda
    weight: 0.7
    kinds: [legs, feet]
    effects:
    - type: body_glow
      target: {kind: joint, id: legs}
      style: {shapes: [wave], fill: 0.0, trail_frames: 18}
      trigger: {hold: 6, fade_in: 2, fade_out: 6}
    # Si además el pie barre el piso, deja su mancha (solo pinta al arrastrarse).
    - type: foot_paint
      style: {size: 0.3, trail_frames: 14}
      trigger: {hold: 6, fade_in: 2, fade_out: 6}
  # Seg. 25-26: el pie que barre el piso deja una mancha de pintura que lo sigue y gira.
  - name: pie_pintura
    weight: 0.5
    kinds: [legs, feet]
    effects:
    - type: foot_paint
      style: {size: 0.3, trail_frames: 14}
      trigger: {hold: 8, fade_in: 2, fade_out: 6}
  # De vez en cuando, disfraces de cuerpo entero: chaqueta metalera con púas (engine/jacket.py) o
  # rayos X.
  # Prendas de cuerpo entero: solo en quien el usuario eligió ese vestuario (wardrobe), y poco.
  - name: chaqueta
    wardrobe: chaqueta
    exclusive: true
    weight: 0.15
    cooldown: 450
    kinds: [torso, left_arm, right_arm]
    yields_to: [prop_worn, face_touch]
    effects:
    - type: adornment
      style: {thickness: 0.012, shapes: [metal_jacket], focus: false}
      trigger: {hold: 20, fade_in: 4, fade_out: 8}
  - name: vestido
    wardrobe: vestido
    exclusive: true
    weight: 0.15
    cooldown: 450
    kinds: [torso, left_arm, right_arm, legs]
    yields_to: [prop_worn, face_touch]
    effects:
    - type: adornment
      style: {thickness: 0.009, shapes: [gown, cocktail, ruffle], focus: false}
      trigger: {hold: 20, fade_in: 4, fade_out: 8}
  - name: rayos_x
    exclusive: true
    weight: 0.25
    kinds: [torso, left_arm, right_arm, legs]
    effects:
    - type: xray
      style: {thickness: 0.01, focus: false}
      trigger: {hold: 8, fade_in: 2, fade_out: 6}
  # Piernas protagonistas: huellas de neón donde cae cada paso.
  - name: huellas
    weight: 0.25
    kinds: [legs, feet]
    effects:
    - type: footprints
      trigger: {hold: 20, fade_in: 2, fade_out: 10}
  # La fiesta también puede llegar con el protagonista en movimiento (no solo con el baile
  # intenso): poco probable y como mucho cada 10 s.
  - name: bola_espejos_spot
    weight: 0.14
    exclusive: true
    cooldown: 300
    kinds: [legs, feet, left_arm, right_arm]
    effects:
    - type: mirror_ball
      style: {focus: false, hdr_gain: 1.7, palette_every: 30}
      trigger: {hold: 30, fade_in: 4, fade_out: 10}
  - name: discoteca_spot
    weight: 0.12
    exclusive: true
    cooldown: 300
    kinds: [legs, feet, left_arm, right_arm]
    effects:
    - type: disco_fx
      style: {focus: false, hdr_gain: 1.8, palette_every: 30}
      trigger: {hold: 24, fade_in: 3, fade_out: 10}
  - name: collar_estrellas
    weight: 0.4
    kinds: [torso]
    effects:
    - type: adornment
      style:
        thickness: 0.016
        shapes: [necklace, chain, chest_stars]
      trigger: {hold: 6, fade_in: 4, fade_out: 8}
  - name: cabeza_accesorio
    weight: 0.5
    kinds: [head]
    # Le cede la cabeza a la gorra recién puesta y a la cara de caricatura (casi siempre).
    yields_to: [prop_worn, face_touch]
    effects:
    - type: adornment
      style:
        thickness: 0.016
        shapes: [cap, cowboy_hat, top_hat, fedora, party_hat, headphones, crown]
      trigger: {hold: 6, fade_in: 4, fade_out: 8}
  # Seg. 28.2: un sombrero lindo con ojos de punto y un cinturón de metal con brillo.
  - name: sombrero_cinturon
    exclusive: true
    weight: 0.25
    kinds: [head, torso, legs]
    yields_to: [prop_worn, face_touch]
    effects:
    - type: adornment
      style: {thickness: 0.016, shapes: [cowboy_hat, top_hat, fedora, party_hat], focus: false}
      trigger: &sombrero {hold: 20, fade_in: 4, fade_out: 8}
    - type: eyewear
      style: {shapes: [dots], thickness: 0.08, focus: false}
      trigger: *sombrero
    - type: adornment
      style: {thickness: 0.016, shapes: [belt], focus: false}
      trigger: *sombrero
  # Seg. 19: cuando la atención es la cara, exagerar la expresión (sudor, "!!", "?", enojo,
  # ojos de corazón; con la boca abierta, sorpresa).
  - name: expresion
    weight: 0.35
    kinds: [head]
    yields_to: [prop_worn, face_touch, neck_slash]
    effects:
    - type: face_toon
      style: {shapes: [sweat, exclaim, question, anger, heart_eyes], thickness: 0.012, palette_every: 30}
      trigger: {hold: 10, fade_in: 2, fade_out: 6}
  - name: cabeza_gafas
    weight: 0.3
    kinds: [head]
    # Le cede la cabeza a la gorra recién puesta y a la cara de caricatura (casi siempre).
    yields_to: [prop_worn, face_touch]
    effects:
    - type: eyewear
      target: {kind: joint, id: nose}
      style:
        thickness: 0.07
        shapes: [frames, glint, hearts, stars, visor]
      trigger: {hold: 6, fade_in: 3, fade_out: 8}
  - name: cabeza_brillo
    weight: 0.3
    kinds: [head]
    # Le cede la cabeza a la gorra recién puesta y a la cara de caricatura (casi siempre).
    yields_to: [prop_worn, face_touch]
    effects:
    - type: body_glow
      target: &id005 {kind: joint, id: head}
      trigger: &id006 {hold: 4, fade_in: 3, fade_out: 6}
      style:
        shapes: [no_outline]
        fill: 0.85
      render: {blend: tint}
    - type: body_glow
      target: *id005
      trigger: *id006
      style: {fill: 0.0}
  - name: silueta_completa
    weight: 0.06
    effects:
    - type: body_glow
      target: &id007 {kind: joint, id: body}
      trigger: &id008 {hold: 2, fade_in: 2, fade_out: 6}
      style:
        shapes: [no_outline]
        fill: 0.85
      render: {blend: tint}
    - type: body_glow
      target: *id007
      style:
        shapes: [abs]
        fill: 0.0
      trigger: *id008
  # Disfraces de cara y cabeza (engine/costumes.py): cada vez sale uno de la lista.
  - name: antifaz
    weight: 0.2
    kinds: [head]
    cooldown: 240
    yields_to: [prop_worn, face_touch]
    effects:
    - type: adornment
      style: {shapes: [hero_mask, masquerade, bat_mask], thickness: 0.009}
      trigger: {hold: 18, fade_in: 3, fade_out: 8}
  - name: animal
    weight: 0.2
    kinds: [head]
    cooldown: 240
    yields_to: [prop_worn, face_touch]
    effects:
    - type: adornment
      style: {shapes: [cat_mask, fox_mask, bunny], thickness: 0.009}
      trigger: {hold: 18, fade_in: 3, fade_out: 8}
  - name: ocurrencia
    weight: 0.2
    kinds: [head]
    cooldown: 240
    yields_to: [prop_worn, face_touch]
    effects:
    - type: adornment
      style: {shapes: [mustache, horns, antennae, ninja_band, pirate_patch], thickness: 0.009}
      trigger: {hold: 18, fade_in: 3, fade_out: 8}
  # Cuello: corbata o moño.
  - name: corbata
    weight: 0.2
    kinds: [torso]
    cooldown: 240
    effects:
    - type: adornment
      style: {shapes: [tie, bowtie], thickness: 0.009}
      trigger: {hold: 18, fade_in: 3, fade_out: 8}
  # Cabeza: un aro sobre la frente (no justo después de la entrada).
  - name: aureola
    weight: 0.3
    kinds: [head]
    cooldown: 240
    yields_to: [entrance]
    yield_chance: 1.0
    yield_window_s: 2.5
    effects:
    - type: adornment
      style: {shapes: [head_ring], thickness: 0.012}
      trigger: {hold: 12, fade_in: 3, fade_out: 8}
  - name: nada
    weight: 0.12
    effects: []
- action: prop_transfer
  options:
  # Seg. 0.6-1.3 de la referencia: un resorte une la gorra con la mano que la recibe; se estira
  # cuando la mano se aleja y se comprime cuando la gorra llega.
  - name: resorte
    weight: 0.7
    effects:
    - type: prop_spring
      style: {rings: 5, size: 0.16, palette_every: 30}
      trigger: {lead: 10, hold: 2, fade_in: 3, fade_out: 4}
  - name: doble_contorno
    weight: 0.3
    effects:
    - type: prop_outline
      style: {shapes: [double], fill: 0.0, palette_every: 30}
      trigger: {hold: 6, fade_in: 1, fade_out: 5}
- action: prop_spin
  options:
  # Seg. 2.3-3.4 de la referencia: mientras gira la gorra en las manos, un anillo la recorre
  # subiendo (color principal) y bajando (acento).
  - name: anillos
    weight: 0.8
    effects:
    - type: prop_rings
      style: {rings: 1, trail_frames: 12, palette_every: 30}
      trigger: {hold: 4, fade_in: 3, fade_out: 5}
    # El resplandor del color sobre la gorra mientras gira (sin contorno).
    - type: prop_outline
      style: {shapes: [no_outline, spin], fill: 0.5, palette_every: 30}
      render: {blend: tint}
      trigger: {hold: 4, fade_in: 3, fade_out: 5}
    # Seg. 3.3-4.1: al terminar de girar, a la gorra le sale una oreja puntiaguda y un corazoncito.
    - type: prop_doodle
      style: {shapes: [horn, heart], palette_every: 30}
      trigger: {anchor: end, hold: 22, fade_in: 2, fade_out: 6}
  - name: nada
    weight: 0.2
    effects: []
- action: prop_worn
  options:
  - name: gorra_puesta
    weight: 1.0
    effects:
    - type: prop_outline
      style: {shapes: [double, worn], fill: 0.0, palette_every: 30}
      # Corto: en la referencia la gorra deja de dibujarse ~1 s después de ponérsela.
      trigger: {hold: 6, fade_in: 2, fade_out: 8}
    # Seg. 6.9-7.2 ("ajustado"): con la gorra recién puesta, la cara teñida y dibujada como
    # caricatura (mandíbula, orejas, ojos de punto, nariz y boca).
    - type: face_toon
      style: {shapes: [tint], fill: 0.75, palette_every: 30}
      render: {blend: tint}
      trigger: {hold: 6, fade_in: 2, fade_out: 8}
    - type: face_toon
      style: {shapes: [caricature], palette_every: 30}
      trigger: {hold: 6, fade_in: 2, fade_out: 8}
- action: face_touch
  options:
  # Seg. 8.2-9.2: la mano en la cara la vuelve caricatura (ojos con pestañas, labios de beso) y,
  # al apartarse, los labios viajan hasta los dedos y los ojos se estiran ("jalón").
  - name: beso
    weight: 1.0
    # Si en realidad se tapa los ojos o se lleva la mano al oído, manda ese gesto.
    yields_to: [cover_eyes, hand_ear]
    yield_chance: 0.9
    effects:
    - type: face_toon
      style: {shapes: [tint], fill: 0.8, palette_every: 30}
      render: {blend: tint}
      trigger: &beso {lead: 8, hold: 10, fade_in: 3, fade_out: 4}
    - type: face_toon
      style: {shapes: [kiss], palette_every: 30}
      trigger: *beso
  # video_41, seg. 21,9: la mano al mentón y la cara de asombro (ojos redondos, boca chiquita).
  - name: asombro
    weight: 0.35
    cooldown: 600
    yields_to: [cover_eyes, hand_ear]
    yield_chance: 0.9
    effects:
    - type: face_toon
      style: {shapes: [shock], thickness: 0.012, palette_every: 30}
      trigger: {hold: 20, fade_in: 2, fade_out: 6}
- action: heart_hands
  options:
  - name: corazon
    weight: 0.85
    effects:
    - type: heart_fx
      style: {thickness: 0.014, palette_every: 30}
      trigger: {hold: 18, fade_in: 2, fade_out: 6}
  - name: nada
    weight: 0.15
    effects: []
- action: point
  options:
  - name: senal
    weight: 0.9
    effects:
    - type: point_fx
      style: {thickness: 0.012, palette_every: 30}
      trigger: {hold: 4, fade_in: 1, fade_out: 6}
  - name: nada
    weight: 0.1
    effects: []
- action: arms_up
  options:
  - name: fiesta
    weight: 0.85
    effects:
    - type: confetti_fx
      style: {palette_every: 30}
      trigger: {hold: 24, fade_in: 1, fade_out: 10}
  - name: nada
    weight: 0.15
    effects: []
- action: hand_ear
  options:
  - name: ondas
    weight: 0.85
    effects:
    - type: sound_waves
      style: {thickness: 0.012, palette_every: 30}
      trigger: {hold: 6, fade_in: 2, fade_out: 6}
  - name: nada
    weight: 0.15
    effects: []
- action: cover_eyes
  options:
  # video_41 seg. 15,6: las manos se mueven sobre la cara: una línea por mano, en triángulo.
  - name: lineas_manos
    weight: 0.3
    cooldown: 300
    effects:
    - type: adornment
      style: {shapes: [hand_lines], thickness: 0.008, focus: false}
      trigger: {hold: 12, fade_in: 1, fade_out: 6}
  - name: antifaz
    weight: 0.8
    effects:
    - type: eyewear
      style: {shapes: [mask, band], thickness: 0.08, palette_every: 30}
      trigger: {hold: 10, fade_in: 2, fade_out: 8}
  # video_41, seg. 16,0-16,3: mientras las manos tapan la cara se contornean ellas (la mano le gana
  # a la máscara); al destaparse aparece la cara de burla (ojos en X y la lengua afuera).
  - name: burla
    weight: 0.35
    cooldown: 600
    effects:
    - type: face_toon
      style: {shapes: [prank], thickness: 0.012, palette_every: 30}
      trigger: {hold: 20, fade_in: 1, fade_out: 6}
  - name: nada
    weight: 0.2
    effects: []
- action: arms_open
  options:
  # Brazos abiertos en cruz: le salen alas.
  - name: alas
    weight: 0.85
    effects:
    - type: wings
      style: {thickness: 0.012, palette_every: 30}
      trigger: {hold: 10, fade_in: 3, fade_out: 8}
  - name: nada
    weight: 0.15
    effects: []
- action: spin_body
  options:
  - name: torbellino
    weight: 0.8
    effects:
    - type: whirl_fx
      style: {focus: false, palette_every: 30}
      trigger: {hold: 10, fade_in: 2, fade_out: 8}
  - name: nada
    weight: 0.2
    effects: []
- action: frenzy
  options:
  # Baile intenso y sostenido (más de 1 s): la furia del estilo de pelea, estelas de energía en
  # manos y pies y los brazos musculosos.
  - name: furia
    weight: 0.6
    min_duration_s: 0.9
    effects:
    - type: swoosh
      target: {kind: joint, id: 'left_wrist,right_wrist,left_ankle,right_ankle'}
      style: {strands: 3, rings: 2, trail_frames: 12, min_speed: 0.05, paint_chance: 0.4, paint_width: 0.22, paint_min_length: 0.8, hdr_gain: 1.8, focus: false}
      trigger: {hold: 10, fade_in: 2, fade_out: 6}
    - type: arm_outline
      target: {kind: joint, id: 'left_wrist,right_wrist'}
      style: {thickness: 0.01, hdr_gain: 1.5, size: 0.5, min_speed: 0.06, chance: 1.0, boil_frames: 3, focus: false}
      trigger: {hold: 10, fade_in: 2, fade_out: 6}
    # Hilos de energía que saltan por el cuerpo y chispas desde manos y pies.
    - type: adornment
      style: {shapes: [energy_sparks], thickness: 0.006, focus: false}
      trigger: {hold: 10, fade_in: 2, fade_out: 6}
    - type: droplets
      target: {kind: joint, id: 'left_wrist,right_wrist,left_ankle,right_ankle'}
      style: {thickness: 0.008, hdr_gain: 1.9, size: 0.5, min_speed: 0.03, chance: 1.0, shapes: [dash, drop], focus: false}
      trigger: {hold: 10, fade_in: 1, fade_out: 8}
  # Mucho movimiento de todo el cuerpo: modo discoteca (destellos disparados y haces de luz) o
  # un ecualizador en el piso que salta con la música.
  - name: discoteca
    exclusive: true
    weight: 0.6
    effects:
    - type: disco_fx
      style: {focus: false, hdr_gain: 1.8, palette_every: 30}
      trigger: {hold: 8, fade_in: 3, fade_out: 10}
  # Bola de espejos arriba: haces rectos de colores y destellos que caen como lluvia.
  - name: bola_espejos
    exclusive: true
    weight: 0.6
    effects:
    - type: mirror_ball
      style: {focus: false, hdr_gain: 1.7, palette_every: 30}
      trigger: {hold: 20, fade_in: 4, fade_out: 10}
  - name: rayos_x
    exclusive: true
    weight: 0.15
    effects:
    - type: xray
      style: {thickness: 0.01, hdr_gain: 1.8}
      trigger: {hold: 20, fade_in: 3, fade_out: 8}
  - name: ecualizador
    exclusive: true
    weight: 0.3
    effects:
    - type: equalizer
      style: {focus: false, hdr_gain: 1.6, palette_every: 30}
      trigger: {hold: 30, fade_in: 4, fade_out: 10}
  - name: nada
    weight: 0.1
    effects: []
