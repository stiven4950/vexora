# Desfile / modelaje (docs/referencias/video_46.md): una modelo camina o posa y cada pocos segundos
# cambia de outfit (un corte). No se dibuja lo que hace: se delinea la ropa. Cada outfit es un
# capítulo con su color, sus trazos (dependen de la prenda: costuras, bordes, franjas, calzado,
# bolso) y una pieza de cabeza que le da personaje.
name: desfile
title: Desfile
subtitle: Delinea cada outfit
description: Para videos de moda con cambios de outfit. Cada look se delinea con su color, sus costuras, el calzado y el bolso, y lleva una pieza de luz en la cabeza.
tags: [moda, desfile, outfit, modelaje, ropa]
seed: 46
needs: [garment]
# Un evento por toma (entre cortes) y un color por toma. Cada efecto vive exactamente su toma: no se
# apaga en el corte (keep_on_cut), sale en guiones antes.
outfits: true
cut_chapters: true
chapters: true
one_at_a_time: false
defaults:
  type: adornment
  target: {kind: joint, id: body}
  style: {focus: false, keep_on_cut: true, palette: [[0.2, 1.0, 0.3], [1.0, 0.08, 0.08], [0.1, 0.95, 1.0], [0.8, 0.5, 1.0], [1.0, 0.5, 0.08], [1.0, 0.25, 0.7], [1.0, 0.9, 0.2]]}
# Sin estrellas al final: el cierre es la luz de prisma sobre la ropa (acción outfit_prism).
always: []
reactions:
# Los trazos de la prenda: completos en el corte, siguen la tela y salen en guiones.
- action: outfit
  options:
  - name: delinear
    weight: 1.0
    effects:
    - type: adornment
      style: {shapes: [garment_lines], thickness: 0.006, focus: false}
      trigger: {hold: 0, cooldown: 0, fade_in: 0, fade_out: 0}
# El estreno de un outfit nuevo: barrido de luz, prenda entera teñida y silueta (video_55).
- action: outfit_reveal
  options:
  - name: revelado
    weight: 1.0
    effects:
    - type: adornment
      style: {shapes: [garment_reveal], thickness: 0.004, focus: false}
      trigger: {hold: 0, cooldown: 0, fade_in: 0, fade_out: 0}
  # A veces el outfit entra directo, ya delineado (como en video_46).
  - name: nada
    weight: 0.4
    effects: []
# Zonas de la prenda pintadas con luz, con un brillo que las recorre (video_55).
- action: outfit_zone
  options:
  - name: zonas
    weight: 1.0
    effects:
    - type: adornment
      style: {shapes: [garment_zones], thickness: 0.004, focus: false}
      trigger: {hold: 0, cooldown: 0, fade_in: 0, fade_out: 0}
# Una onda tipo electrocardiograma que cruza el pantalón (video_55); no en todos los outfits.
- action: outfit_wave
  options:
  - name: onda
    weight: 0.45
    effects:
    - type: adornment
      style: {shapes: [garment_ecg], thickness: 0.004, focus: false}
      trigger: {hold: 0, cooldown: 0, fade_in: 3, fade_out: 3}
  - name: nada
    weight: 0.55
    effects: []
# La pieza de cabeza del outfit, según lo que lleva (video_46): con gorra, una barra de luz sobre los
# ojos; con sombrero o boina, un aro; con gafas, sus gafas delineadas. Sin nada de eso, una al azar que
# no se repite en el video (cachos, orejas, corona, aro).
- action: outfit_head
  options:
  - name: visera_gorra
    weight: 20.0
    accessories: [cap]
    effects:
    - type: eyewear
      target: {kind: joint, id: nose}
      style: {thickness: 0.05, shapes: [visor], focus: false}
      trigger: {hold: 0, cooldown: 0, fade_in: 0, fade_out: 2}
  - name: aro_sombrero
    weight: 20.0
    accessories: [hat, beanie, beret]
    effects:
    - type: adornment
      style: {shapes: [head_halo], thickness: 0.006, focus: false}
      trigger: {hold: 0, cooldown: 0, fade_in: 0, fade_out: 2}
  - name: gafas
    weight: 20.0
    accessories: [sunglasses, glasses]
    effects:
    - type: eyewear
      target: {kind: joint, id: nose}
      style: {thickness: 0.05, shapes: [frames], focus: false}
      trigger: {hold: 0, cooldown: 0, fade_in: 0, fade_out: 2}
  - name: cachos
    weight: 1.0
    max_uses: 1
    effects:
    - type: adornment
      style: {shapes: [horns], thickness: 0.006, focus: false}
      trigger: {hold: 0, cooldown: 0, fade_in: 0, fade_out: 2}
  - name: orejas
    weight: 1.0
    max_uses: 1
    effects:
    - type: adornment
      style: {shapes: [cat_ears], thickness: 0.006, focus: false}
      trigger: {hold: 0, cooldown: 0, fade_in: 0, fade_out: 2}
  - name: corona
    weight: 0.8
    max_uses: 1
    effects:
    - type: adornment
      style: {shapes: [light_crown], thickness: 0.006, focus: false}
      trigger: {hold: 0, cooldown: 0, fade_in: 0, fade_out: 2}
  - name: aro
    weight: 0.8
    max_uses: 1
    effects:
    - type: adornment
      style: {shapes: [head_halo], thickness: 0.006, focus: false}
      trigger: {hold: 0, cooldown: 0, fade_in: 0, fade_out: 2}
  # Lucecitas sobre el pelo, como una guirnalda (outfit naranja de video_46).
  - name: lucecitas
    weight: 1.0
    max_uses: 1
    effects:
    - type: adornment
      style: {shapes: [hair_lights], thickness: 0.004, focus: false}
      trigger: {hold: 0, cooldown: 0, fade_in: 2, fade_out: 3}
# Anillos en codos y rodillas, con arcos en los hombros (outfit cian de video_46). No en todos los outfits.
- action: outfit_joints
  options:
  - name: anillos
    weight: 0.35
    effects:
    - type: adornment
      style: {shapes: [joint_rings], thickness: 0.005, focus: false}
      trigger: {hold: 0, cooldown: 0, fade_in: 0, fade_out: 3}
  - name: nada
    weight: 0.65
    effects: []
# Al caminar, cada pie que se apoya enciende su suela y abre un anillo en el piso. Solo `step`: el
# pisotón (`stomp`) y el golpe de pie (`foot_strike`) son del baile.
- action: step
  options:
  - name: pisada
    weight: 0.7
    cooldown: 6
    effects:
    - type: adornment
      style: {shapes: [step_glint], thickness: 0.004, focus: false}
      # Empieza cuando el pie se apoya (el final del paso), con el color del outfit de ese momento.
      trigger: {hold: 10, cooldown: 0, fade_in: 0, fade_out: 0, anchor: end}
  - name: nada
    weight: 0.3
    effects: []
# Burbujas de luz alrededor; una en la mano que más se mueve (video_55). No en todos los outfits.
- action: outfit_bubbles
  options:
  - name: burbujas
    weight: 0.35
    effects:
    - type: adornment
      style: {shapes: [garment_bubbles], thickness: 0.004, focus: false}
      trigger: {hold: 0, cooldown: 0, fade_in: 3, fade_out: 3}
  - name: nada
    weight: 0.65
    effects: []
# La estela del bolso o la mochila cuando se balancea (solo dibuja si se mueve rápido).
- action: outfit_trail
  options:
  - name: estela
    weight: 1.0
    effects:
    - type: adornment
      style: {shapes: [garment_trail], thickness: 0.004, focus: false}
      trigger: {hold: 0, cooldown: 0, fade_in: 0, fade_out: 0}
# El cierre: luz de prisma sobre la ropa en el último segundo (video_55).
- action: outfit_prism
  options:
  - name: prisma
    weight: 1.0
    effects:
    - type: adornment
      style: {shapes: [garment_prism], thickness: 0.004, focus: false}
      trigger: {hold: 0, cooldown: 0, fade_in: 0, fade_out: 0}
