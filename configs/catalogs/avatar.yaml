# Avatar: maestro fuego (referencia glowing/video_18.mp4; lectura en docs/referencias/video_18.md).
# Une los presets avatar_fire (fuego) y avatar_storm (rayos, chispas, grietas) en un solo estilo
# de coreografía: el fuego sale de lo que hace el cuerpo (látigos con la forma del golpe, llamas en
# las manos, fuego a ras del piso, el cuerpo que arde), la pantalla se tiñe de naranja con el fuego
# grande, el estado Avatar (flecha en la frente, ojos encendidos) enmarca el video, y el rayo de
# avatar_storm queda como el rayo de los maestros fuego en algunos golpes y al señalar.
name: avatar
title: Avatar
description: 'Maestro fuego: látigos de fuego con la forma de cada golpe, llamas en las manos, fuego a ras del piso, la calavera y el cuerpo en llamas, rayos al señalar, y el estado Avatar con una pared de fuego al final.'
tags: [avatar, fuego, artes marciales, acrobacia, rayos]
colors:
  - [1.0, 0.36, 0.03]   # borde del fuego: naranja profundo (el cuerpo y el núcleo los pone firebend.py)
  - [1.0, 0.36, 0.03]
seed: 18
# Capítulos de elemento: lo que no dice su elemento es fuego; el rayo cian no sale en medio del
# fuego ni el fuego en medio del rayo (glowing/video_51: cada elemento es un capítulo).
element: fuego
# El video se reparte en capítulos de ~3,5 s, cada uno de un elemento: fuego casi siempre (y al
# principio y al final), rayo donde lanza o señala, aire donde gira, salta o voltea.
element_mix: {fuego: 1.0, rayo: 0.35, aire: 0.35}
# Ningún tramo de más de 1,2 s sin fuego (en la referencia siempre hay algo, aunque sean brasas).
max_gap_s: 1.2
attention: true
# Los golpes, saltos y giros se reparten primero los dos focos; las pisadas y el foco del cuerpo,
# después (si no, el fuego del piso de cada paso tapaba los látigos: seg. 0,8-1,6).
priority: [jump, arms_open, frenzy, flip, fast_swing, lunge, spin_body, landing, heart_hands, hands_on_head]

defaults:
  type: adornment
  target: {kind: joint, id: nose}
  time: {start_frame: 0, end_frame: -1, fade_in: 1, fade_out: 4}
  # El fuego se pinta como en video_18 (cuerpo blanco, borde amarillo, resplandor naranja); de
  # video_51 se toman las formas (chorro, alfombra, aro grande), no la pintura.
  style: {thickness: 0.008, hdr_gain: 1.6, focus: false}
  # Brillo de caída larga (5 pasadas, hasta 24x el radio), como el Deep Glow.
  render: {blend: add, motion_blur: 0.0, persistence: 0.0, group: glow, glow_layers: 5}

always:
  # La luz del fuego sobre el plano: tiñe ropa, piel y piso de naranja conservando su textura y
  # oscurece un poco el resto cuando hay mucho fuego (se mezcla multiplicando, antes del fuego).
  - type: adornment
    style: {shapes: [fire_light], size: 1.0, focus: false}
    render: {blend: multiply, group: grade}
  # Brasas que se desprenden de las extremidades rápidas.
  - type: droplets
    target: {kind: joint, id: "left_wrist,right_wrist,left_ankle,right_ankle"}
    style: {thickness: 0.008, hdr_gain: 1.9, size: 0.3, min_speed: 0.25, chance: 0.3, shapes: [dash, leaf]}
  # Cierre (seg. 14,4-16): la pared de fuego sube del piso; la flecha y los ojos se encienden.
  # De vez en cuando (4 de cada 10 videos) y solo si la persona termina quieta y mirando de frente
  # (video_18 se arrodilla de frente; en video_51 camina y no hay pared). Lo de frente lo decide el
  # motor al empezar el cierre.
  - type: adornment
    when: quieto_al_final
    chance: 0.4
    style: {shapes: [fire_wall], size: 1.8, focus: false}
    # Sin fundido de salida: queda encendida hasta el último cuadro (al desvanecerse se notaban
    # las llamas sueltas con que se arma).
    time: {start_frame: 0, end_frame: -1, fade_in: 0, fade_out: 0}
  # Cierre con la alfombra de lenguas (video_51, seg. 2,7): solo al final, cuando la persona lleva
  # más de 2 s de frente, y si no salió la pared. El motor cuenta la racha de frente.
  - type: adornment
    style: {shapes: [fire_carpet_end], focus: false}
    time: {start_frame: 0, end_frame: -1, fade_in: 0, fade_out: 0}

reactions:
  # Seg. 0: el estado Avatar.
  - action: entrance
    options:
      - name: estado_avatar
        element: ""
        weight: 1.0
        effects:
          - type: adornment
            style: {shapes: [avatar_mark]}
            trigger: {hold: 16, fade_in: 2, fade_out: 8}

  # Seg. 0,8 y 14: brazos abiertos en el salto o al caer: dos látigos y la pantalla naranja.
  - action: arms_open
    options:
      - name: latigos
        weight: 0.8
        effects:
          - &whip {type: adornment, style: {shapes: [fire_whip]}, trigger: {hold: 10, fade_in: 1, fade_out: 5}}
          - &heat {type: grade, style: {colors: [[1.0, 0.45, 0.08]], intensity: 0.25, focus: false}, render: {blend: add, group: glow}, trigger: {hold: 6, fade_in: 2, fade_out: 8}}
      - name: alas
        weight: 0.2
        effects:
          - type: adornment
            style: {shapes: [body_blaze]}
            trigger: {hold: 14, fade_in: 2, fade_out: 6}
          - *heat

  # Seg. 1,6: salto: remolinos de fuego y pantalla naranja.
  - action: jump
    options:
      - name: remolinos
        weight: 0.7
        effects: [*whip, *heat]
      # Viento (elemento aire, glowing/video_51 seg. 8,1-11,4): como el swoosh, pero de aire: las
      # extremidades rápidas dejan estelas de neón. Blanco liso, sin halo ni resplandor, o azul.
      - name: viento
        element: aire
        weight: 0.35
        effects:
          - &wind
            type: swoosh
            target: {kind: joint, id: "left_wrist,right_wrist,left_ankle,right_ankle"}
            style: {colors: [[1.0, 1.0, 1.0]], trail_style: plain, strands: 2, trail_frames: 14, min_speed: 0.1, thickness: 0.12, hdr_gain: 1.0, focus: false, shapes: [wind]}
            render: {blend: over, motion_blur: 0.0, group: glow, glow_layers: 1}
            trigger: {hold: 10, fade_in: 1, fade_out: 5}
      - name: viento_azul
        element: aire
        weight: 0.2
        effects:
          - &wind_blue
            type: swoosh
            target: {kind: joint, id: "left_wrist,right_wrist,left_ankle,right_ankle"}
            style: {colors: [[0.35, 0.65, 1.0]], trail_style: plain, strands: 2, trail_frames: 14, min_speed: 0.1, thickness: 0.1, hdr_gain: 1.6, focus: false, shapes: [wind, glow]}
            render: {blend: add, motion_blur: 0.0, group: glow, glow_layers: 3}
            trigger: {hold: 10, fade_in: 1, fade_out: 5}
      - name: aliento
        weight: 0.3
        cooldown: 450
        effects:
          - &breath {type: adornment, style: {shapes: [fire_breath]}, trigger: {hold: 26, fade_in: 1, fade_out: 6}}
          - &heat2 {type: grade, style: {colors: [[1.0, 0.45, 0.08]], intensity: 0.2, focus: false}, render: {blend: add, group: glow}, trigger: {hold: 14, fade_in: 2, fade_out: 8}}

  # Seg. 1,2: brazos arriba: llamas que suben de las manos.
  - action: arms_up
    options:
      - name: llamas_arriba
        weight: 0.5
        effects:
          - &hands {type: adornment, style: {shapes: [hand_fire]}, trigger: {hold: 14, fade_in: 2, fade_out: 6}}
      # Seg. 4,2: de la mano levantada sale un ave de fuego que vuela y vuelve. Las criaturas son
      # un recurso de una sola vez por video: el ave, la serpiente y el dragón.
      - name: ave
        weight: 0.3
        max_uses: 1
        effects:
          - &bird {type: adornment, style: {shapes: [fire_bird]}, trigger: {hold: 22, fade_in: 1, fade_out: 6}}
          - *heat2
      - name: serpiente
        weight: 0.2
        max_uses: 1
        effects:
          - &serpent {type: adornment, style: {shapes: [fire_serpent]}, trigger: {hold: 22, fade_in: 1, fade_out: 6}}
          - *heat2
      - name: dragon
        weight: 0.2
        max_uses: 1
        effects:
          - &dragon {type: adornment, style: {shapes: [fire_dragon]}, trigger: {hold: 22, fade_in: 2, fade_out: 6}}
          - *heat2

  # Seg. 2,0 y 12,4: cae al piso o pisa fuerte: fuego a ras del piso.
  - action: landing
    options:
      # video_51, seg. 2,4: si el fuego venía en los pies (una voltereta), al caer se desbarata en
      # el suelo; si no, el golpe de piso.
      - name: desbarate
        weight: 0.6
        effects:
          - &landing {type: adornment, style: {shapes: [fire_landing]}, trigger: {hold: 12, fade_in: 1, fade_out: 4}}
          - *heat2
      # Seg. 5,0: el fuego choca contra el piso y se expande en olas que tiemblan como gelatina.
      - name: golpe_piso
        weight: 0.5
        effects:
          - &splash {type: adornment, style: {shapes: [fire_splash]}, trigger: {hold: 16, fade_in: 1, fade_out: 6}}
          - *heat2
      - name: piso
        weight: 0.5
        effects:
          - &floor {type: adornment, style: {shapes: [floor_fire]}, trigger: {hold: 16, fade_in: 1, fade_out: 8}}
          - *heat
  - action: stomp
    options:
      - name: piso
        weight: 0.3
        effects: [*floor]
      - name: nada
        weight: 0.7

  # Seg. 2,8 y 6,0-7,6: manos juntas frente al pecho o la cara: una sola llama que se achica.
  - action: heart_hands
    options:
      - name: vela
        weight: 1.0
        effects:
          - type: adornment
            style: {shapes: [candle]}
            trigger: {hold: 30, fade_in: 2, fade_out: 8}

  # Seg. 3,2: manos junto a la cabeza: la calavera de fuego.
  - action: hands_on_head
    options:
      - name: calavera
        weight: 1.0
        cooldown: 300
        effects:
          - &skull {type: adornment, style: {shapes: [fire_skull], thickness: 0.009}, trigger: {hold: 18, fade_in: 2, fade_out: 6}}
  - action: lunge
    options:
      # video_51, seg. 4,0-4,7: gira el fuego alrededor del cuerpo, lo atrapa y, al estirar el
      # brazo, lo lanza como una explosión.
      - name: orbita
        weight: 0.25
        max_uses: 2
        effects:
          - &orbit {type: adornment, style: {shapes: [fire_orbit]}, trigger: {hold: 30, fade_in: 1, fade_out: 5}}
          - *heat
      - name: viento
        element: aire
        weight: 0.4
        effects: [*wind]
      - name: calavera
        weight: 0.4
        cooldown: 300
        effects: [*skull, *heat]
      # El swoosh de fuego: la mano (o el pie) lleva la llama prendida y la estela la persigue.
      # Es el efecto más recurrente; las medialunas quedan para abrir los brazos y saltar.
      - name: estela
        weight: 0.9
        effects:
          - &trail {type: adornment, style: {shapes: [fire_trail]}, trigger: {hold: 8, fade_in: 1, fade_out: 5}}
      # video_51, seg. 3,0 y 3,6: chorro de fuego desde el puño, en la dirección del antebrazo.
      - name: chorro
        weight: 0.2
        cooldown: 90
        effects:
          - &blast {type: adornment, style: {shapes: [fire_blast]}, trigger: {hold: 14, fade_in: 1, fade_out: 5}}
          - *heat

  # Seg. 3,6-4,8: golpes y barridos: el látigo con la forma del golpe; a veces un aro o el rayo.
  - action: fast_swing
    options:
      - name: viento
        element: aire
        weight: 0.15
        cooldown: 120
        effects: [*wind]
      # El swoosh de fuego es el efecto más recurrente del catálogo.
      - name: estela
        weight: 1.3
        effects: [*trail, *heat]
      - name: chorro
        weight: 0.15
        cooldown: 90
        effects: [*blast, *heat]
      - name: aro
        weight: 0.15
        cooldown: 120
        effects:
          - type: adornment
            style: {shapes: [fire_ring]}
            trigger: {hold: 12, fade_in: 1, fade_out: 5}
      # El rayo cian (glowing/video_51, seg. 5,0-6,7), combinado con el rayo actual: la cinta
      # quebrada y plana de la referencia más el trazo fino con núcleo claro y las ramas. Va de la
      # mano al borde del cuadro, deja un lazo por donde barre el brazo y salta en chispazos por el
      # cuerpo; el cuadro se tiñe de azul (fire_light).
      - name: rayo
        element: rayo
        weight: 0.15
        cooldown: 150
        effects:
          - &bolt
            type: lightning
            target: {kind: joint, id: right_wrist}
            style:
              colors: [[0.35, 0.92, 1.0], [0.1, 0.62, 0.85], [0.0, 0.3, 0.75]]
              thickness: 0.008
              hdr_gain: 1.3
              lightning: {branches: 4, branch_depth: 2, branch_angle: 34, jitter: 0.38, reseed_every: 1, tail_frames: 3, sparks: 4, reach: 2.2, ribbon: 0.2, to_edge: true, trail: 8, crackle: 3, hands_only: true}
            # Tapa el fondo (no se suma): sobre una pared clara, sumado, el cian se iba al blanco.
            render: {blend: over, motion_blur: 0.0, group: lightning, persistence: 0.2, glow_layers: 3}
            trigger: {hold: 14, fade_in: 1, fade_out: 5}
      # El rayo de los maestros fuego de antes (de avatar_storm): fino, quebrado y color fuego.
      - name: rayo_fuego
        weight: 0.05
        cooldown: 150
        effects:
          - &bolt_fire
            type: lightning
            target: {kind: joint, id: right_wrist}
            style:
              colors: [[1.0, 0.9, 0.7], [1.0, 0.5, 0.1], [0.9, 0.2, 0.05]]
              thickness: 0.007
              hdr_gain: 2.2
              lightning: {branches: 4, branch_depth: 2, branch_angle: 34, jitter: 0.42, reseed_every: 2, tail_frames: 3, sparks: 6, reach: 2.2, hands_only: true}
            render: {blend: add, motion_blur: 0.0, group: lightning, persistence: 0.3, glow_layers: 2}
            trigger: {hold: 8, fade_in: 1, fade_out: 5}
      - name: nada
        weight: 0.08

  # Señalar o el revólver con la mano: el rayo de los maestros fuego.
  - action: point
    options:
      - name: rayo
        element: rayo
        weight: 0.7
        effects: [*bolt]
      - name: estela
        weight: 0.5
        effects: [*trail]
  - action: finger_gun
    options:
      - name: rayo
        element: rayo
        weight: 0.8
        effects: [*bolt]
      - name: rayo_fuego
        weight: 0.2
        effects: [*bolt_fire]

  # video_51, seg. 5,0 y 6,2: el brazo que se extiende para lanzar: el rayo hasta el borde.
  - action: throw
    options:
      - name: rayo
        element: rayo
        weight: 0.6
        cooldown: 90
        effects: [*bolt]
      - name: chorro
        weight: 0.25
        effects: [*blast, *heat]

  # Puño en alto: llama en el puño.
  - action: fist_up
    options:
      - name: puño_en_llamas
        weight: 1.0
        effects: [*hands]

  # Giros: un aro de fuego o látigos en las dos manos.
  - action: spin_body
    options:
      - name: viento
        element: aire
        weight: 0.4
        effects: [*wind]
      - name: viento_azul
        element: aire
        weight: 0.2
        effects: [*wind_blue]
      - name: aro
        weight: 0.5
        effects:
          - type: adornment
            style: {shapes: [fire_ring]}
            trigger: {hold: 14, fade_in: 1, fade_out: 5}
      - name: estelas
        weight: 0.9
        effects: [*trail]
      # video_51, seg. 2,4: un aro grande de fuego que sube de un pie y rodea todo el cuerpo.
      - name: aro_grande
        weight: 0.5
        cooldown: 200
        effects:
          - &halo {type: adornment, style: {shapes: [fire_halo]}, trigger: {hold: 18, fade_in: 1, fade_out: 6}}
          - *heat2

  # Seg. 5,2 y 9,2-10,8: pasos y barridos a ras del piso: la raya de fuego crece por donde pasa.
  - action: step
    options:
      - name: raya
        weight: 0.2
        cooldown: 60
        effects: [*floor]
      - name: nada
        weight: 0.8

  # Seg. 11,2-11,6: cuerpo entero en tensión: el cuerpo arde.
  - action: frenzy
    options:
      - name: estelas
        weight: 1.0
        effects: [*trail, *heat]
      # Seg. 8,0: el fuego sube a la cabeza y sale por la boca; queda la cara de demonio.
      - name: aliento
        weight: 0.3
        cooldown: 450
        effects:
          - *breath
          - *heat2
      - name: cuerpo_en_llamas
        weight: 0.5
        cooldown: 300
        effects:
          - type: adornment
            style: {shapes: [body_blaze]}
            trigger: {hold: 16, fade_in: 2, fade_out: 8}
          - *heat

  # Volteretas y rodadas por el piso: el cuerpo arde o un aro de fuego.
  - action: flip
    options:
      - name: viento
        element: aire
        weight: 0.3
        effects: [*wind]
      - name: dragon
        weight: 0.3
        max_uses: 1
        effects: [*dragon, *heat2]
      - name: estelas
        weight: 0.5
        effects: [*trail, *heat]
      - name: cuerpo_en_llamas
        weight: 0.3
        cooldown: 200
        effects:
          - {type: adornment, style: {shapes: [body_blaze]}, trigger: {hold: 14, fade_in: 2, fade_out: 8}}
          - *heat
      - name: aro
        weight: 0.3
        effects:
          - {type: adornment, style: {shapes: [fire_ring]}, trigger: {hold: 12, fade_in: 1, fade_out: 5}}
      - name: aro_grande
        weight: 0.35
        cooldown: 200
        effects: [*halo]
  - action: tumble
    options:
      - name: desbarate
        weight: 0.3
        effects: [*landing]
      # Rodando por el piso la atención está en los pies: el fuego sale de ellos.
      - name: estelas
        weight: 0.4
        effects: [*trail]
      - name: piso
        weight: 0.3
        effects: [*floor, *heat]
      - name: golpe_piso
        weight: 0.3
        effects: [*splash]
      - name: nada
        weight: 0.4

  # Mano en alto o brazos cruzados: llamas en las manos.
  - action: raise_hand
    options:
      - name: orbita
        weight: 0.25
        max_uses: 2
        effects: [*orbit]
      - name: llama
        weight: 0.3
        effects: [*hands]
      - name: ave
        weight: 0.25
        max_uses: 1
        effects: [*bird, *heat2]
      - name: serpiente
        weight: 0.15
        max_uses: 1
        effects: [*serpent, *heat2]
      - name: nada
        weight: 0.5
  - action: arms_crossed
    options:
      - name: llamas
        weight: 1.0
        cooldown: 150
        effects: [*hands, *heat]

  # De avatar_storm: chispas en los golpes y grietas al contacto, en tonos de fuego.
  - action: impact
    options:
      - name: chispas
        element: ""
        weight: 0.4
        effects:
          - type: sparks
            target: {kind: event_point, id: impact}
            style: {colors: [[1.0, 0.95, 0.7], [1.0, 0.45, 0.08]], thickness: 0.04, hdr_gain: 2.6}
            render: {blend: add, motion_blur: 0.4, group: particles, persistence: 0.28, glow_layers: 2}
            trigger: {hold: 8, fade_in: 0, fade_out: 6}
      - name: nada
        weight: 0.6
  - action: hand_contact
    options:
      - name: grietas
        element: ""
        weight: 0.5
        effects:
          - type: cracks
            target: {kind: event_point, id: contact}
            style: {colors: [[1.0, 0.9, 0.6], [1.0, 0.35, 0.05]], thickness: 0.012, hdr_gain: 2.4}
            render: {blend: add, group: interaction, persistence: 0.4, glow_layers: 2}
            trigger: {hold: 14, fade_in: 3, fade_out: 8}
      - name: nada
        weight: 0.5

  # Pausas: la mirada se enciende (seg. 7,6 y 8,8) o brasas.
  - action: still
    options:
      - name: mirada
        element: ""
        weight: 0.5
        cooldown: 150
        effects:
          - type: adornment
            style: {shapes: [avatar_mark]}
            trigger: {hold: 14, fade_in: 2, fade_out: 6}
      - name: nada
        weight: 0.5

  # Lo que más se mueve, entre gesto y gesto: llamas en las manos, fuego en el piso o la mirada.
  - action: spotlight
    options:
      - name: estela
        weight: 0.6
        kinds: [left_arm, right_arm]
        effects: [*trail]
      # En un capítulo de rayo o de aire, entre gesto y gesto: el rayo en la mano o el viento.
      - name: rayo
        element: rayo
        weight: 0.5
        kinds: [left_arm, right_arm]
        cooldown: 60
        effects: [*bolt]
      - name: viento
        element: aire
        weight: 0.6
        effects: [*wind]
      - name: orbita
        weight: 0.15
        kinds: [left_arm, right_arm]
        max_uses: 2
        effects: [*orbit]
      - name: manos
        weight: 0.3
        kinds: [left_arm, right_arm]
        effects: [*hands]
      - name: piso
        weight: 0.3
        kinds: [legs, feet]
        effects: [*floor]
      - name: mirada
        element: ""
        weight: 0.25
        kinds: [head]
        cooldown: 150
        effects:
          - type: adornment
            style: {shapes: [avatar_mark]}
            trigger: {hold: 12, fade_in: 2, fade_out: 6}
