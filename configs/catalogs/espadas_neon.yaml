# Catálogo de espadas estilo neón (referencia glowing/video_38.mp4): una persona sola con dos
# hojas, acrobacias. Hojas pintadas de neón siempre, copias fantasma al moverlas, arcos en la
# punta, contorno del cuerpo en las volteretas y salpicaduras en el piso al aterrizar.
# Ver docs/catalogo_efectos.md, sección "Espadas".
name: espadas_neon
title: Espadas neón
description: "Hojas pintadas de neón cian y lima, ecos fantasma, arcos en cada tajo y siluetas en las acrobacias."
seed: 38
needs: [blades]
colors:
  - [0.2, 1.0, 0.85]    # hoja izquierda: cian
  - [0.85, 1.0, 0.15]   # hoja derecha: verde lima

defaults:
  type: swoosh
  target: {kind: joint, id: right_wrist}
  time: {start_frame: 0, end_frame: -1, fade_in: 2, fade_out: 4}
  style: {thickness: 0.014, hdr_gain: 1.8, boil_frames: 2}
  render: {blend: add, motion_blur: 0.0, persistence: 0.0, group: glow}

always:
  # La hoja está pintada de neón en todo momento.
  - type: blade_glow
    target: {kind: joint, id: blade_right_tip}
    style: {thickness: 0.035, hdr_gain: 2.0}

reactions:
  # Tajo: arco en la punta de la hoja (seg. 3.3, 3.7).
  - action: blade_swing
    options:
      - name: arco
        weight: 0.4
        effects:
          - type: swoosh
            target: {kind: joint, id: "blade_left_tip,blade_right_tip"}
            style: {strands: 1, trail_frames: 12, min_speed: 0.15, thickness: 0.016}
            trigger: {hold: 8, fade_in: 1, fade_out: 5}
      - name: arco_doble
        weight: 0.25
        effects:
          - type: swoosh
            target: {kind: joint, id: "blade_left_tip,blade_right_tip"}
            style: {strands: 2, trail_frames: 10, min_speed: 0.15, thickness: 0.014}
            trigger: {hold: 8, fade_in: 1, fade_out: 5}
      # Copias fantasma de la hoja en algunos tajos (seg. 0.2, 1.1, 4.3, 7.8).
      - name: eco
        weight: 0.2
        effects:
          - type: blade_echo
            target: {kind: joint, id: blade_right_tip}
            style: {thickness: 0.03, hdr_gain: 1.7}
            trigger: {hold: 8, fade_in: 1, fade_out: 4}
      - name: nada
        weight: 0.15

  # Patada: rayas de velocidad en el pie (seg. 1.9). "Algunas veces a la espada, otras a los pies."
  - action: fast_swing
    options:
      - name: pies
        weight: 0.35
        limbs: [left_ankle, right_ankle]
        effects:
          - type: swoosh
            target: {kind: joint, id: "left_ankle,right_ankle"}
            style: {colors: [[0.85, 1.0, 0.15]], strands: 3, trail_frames: 6, min_speed: 0.12, thickness: 0.01}
            trigger: {hold: 6, fade_in: 1, fade_out: 4}
      - name: nada
        weight: 0.65

  # Voltereta: el cuerpo se contornea (seg. 3.1-3.5) o se marca con rayas (seg. 2.2).
  - action: tumble
    options:
      - name: silueta
        weight: 0.5
        effects:
          - type: body_outline
            target: {kind: mask, id: person}
            style: {colors: [[0.85, 1.0, 0.15]], thickness: 0.012, hdr_gain: 1.8, boil_frames: 2, shapes: [outline, double]}
            trigger: {hold: 10, fade_in: 1, fade_out: 5}
      - name: rayas
        weight: 0.3
        effects:
          - type: body_outline
            target: {kind: mask, id: person}
            style: {colors: [[0.85, 1.0, 0.15]], thickness: 0.012, hdr_gain: 1.8, boil_frames: 2, shapes: [dashes]}
            trigger: {hold: 8, fade_in: 1, fade_out: 4}
      - name: nada
        weight: 0.2

  - action: jump
    options:
      - name: silueta
        weight: 0.4
        effects:
          - type: body_outline
            target: {kind: mask, id: person}
            style: {colors: [[0.85, 1.0, 0.15]], thickness: 0.012, hdr_gain: 1.8, boil_frames: 2, shapes: [outline]}
            trigger: {hold: 8, fade_in: 1, fade_out: 5}
      - name: nada
        weight: 0.6

  # Aterrizaje: salpicadura en abanico sobre el piso (seg. 2.3, 4.2-4.5, 6.6, 7.4).
  - action: landing
    options:
      - name: salpicadura
        weight: 0.75
        effects:
          - type: ground_burst
            target: {kind: event_point, id: landing}
            style: {colors: [[0.85, 1.0, 0.15]], size: 0.45, thickness: 0.012, hdr_gain: 1.9}
            trigger: {hold: 12, fade_in: 1, fade_out: 6}
      - name: nada
        weight: 0.25

  - action: blade_ground
    options:
      - name: salpicadura
        weight: 0.6
        effects:
          - type: ground_burst
            target: {kind: event_point, id: blade_ground}
            style: {colors: [[0.85, 1.0, 0.15]], size: 0.4, thickness: 0.012, hdr_gain: 1.9}
            trigger: {hold: 10, fade_in: 1, fade_out: 5}
      - name: nada
        weight: 0.4

  # Pausa con intención: cruz en el pecho antes del siguiente tajo (seg. 7.2).
  - action: intent
    options:
      - name: cruz
        weight: 0.5
        effects:
          - type: intent_mark
            target: {kind: joint, id: right_wrist}
            style: {colors: [[0.85, 1.0, 0.15]], size: 0.35, thickness: 0.014, hdr_gain: 1.9, boil_frames: 3, shapes: [cross]}
            trigger: {hold: 16, fade_in: 2, fade_out: 6}
      - name: nada
        weight: 0.5
