# Catálogo de reacciones para peleas, derivado de la referencia glowing/video_1.mp4.
# Cada acción detectada sortea UNA reacción por ocurrencia según los pesos ("nada" incluida).
# Las decisiones de cada corrida quedan en runs/<video>/scripts/choreography.json.
# Ver docs/catalogo_efectos.md para el origen de cada reacción.
name: pelea
title: Pelea neón
subtitle: Combate cuerpo a cuerpo
description: "Combate cuerpo a cuerpo: trayectorias de neón, llamaradas en cada golpe, estrellas, rayos desde la mirada y energía al chocar puños."
seed: 21
colors:
  - [1.0, 0.55, 0.12]   # person_0: naranja fuego
  - [0.18, 0.5, 1.0]    # person_1: azul eléctrico

defaults:
  type: swoosh
  target: {kind: joint, id: right_wrist}
  time: {start_frame: 0, end_frame: -1, fade_in: 2, fade_out: 4}
  style:
    thickness: 0.012
    hdr_gain: 1.6
    boil_frames: 2
    # Cada activación sortea dos colores de esta paleta de neón.
    palette:
      - [1.0, 0.55, 0.12]   # naranja fuego
      - [0.18, 0.5, 1.0]    # azul eléctrico
      - [1.0, 0.2, 0.75]    # magenta
      - [0.2, 1.0, 0.85]    # cian menta
      - [0.6, 1.0, 0.2]     # lima
      - [0.62, 0.3, 1.0]    # violeta
      - [1.0, 0.85, 0.2]    # oro
      - [1.0, 0.25, 0.25]   # rojo
      - [1.0, 0.5, 0.65]    # rosa
      - [0.35, 0.85, 1.0]   # celeste
  render: {blend: add, motion_blur: 0.0, persistence: 0.0, group: glow}

# Sin sorteo: tienen su propia probabilidad por golpe.
always:
  - type: droplets
    target: {kind: joint, id: "left_wrist,right_wrist"}
    style: {thickness: 0.009, hdr_gain: 1.8, size: 0.35, min_speed: 0.25, chance: 0.35,
            shapes: [drop, ring, leaf, curl, dash]}

reactions:
  # Seg. 1-2 de la referencia: al chocar de hombros, descarga eléctrica en el punto de choque.
  - action: body_bump
    options:
      - name: colision
        weight: 0.85
        effects:
          - type: clash
            target: {kind: event_point, id: body_bump}
            style: {micro_sparks: 45, size: 0.6, hdr_gain: 1.4}
            trigger: {hold: 16, fade_in: 1, fade_out: 6}
      - name: nada
        weight: 0.15

  # Movimiento rápido de una extremidad. El swoosh es la reacción más común, pero no la única:
  # a veces la mirada dispara un rayo al rival (seg. 14.7) o el brazo se dibuja musculoso.
  - action: fast_swing
    options:
      - name: swoosh
        weight: 0.6
        effects:
          - type: swoosh
            target: {kind: joint, id: "left_wrist,right_wrist,left_ankle,right_ankle"}
            style: {strands: 3, rings: 2, trail_frames: 10, min_speed: 0.12, paint_chance: 0.35,
                    paint_width: 0.22, paint_min_length: 0.8, hdr_gain: 1.8}
            trigger: {hold: 8, fade_in: 1, fade_out: 4}
      - name: rayo_ojos
        weight: 0.12
        cooldown: 90
        requires_person: true
        effects:
          - type: beam
            target: {kind: event_point, id: eyes}
            style: {size: 0.45, hdr_gain: 1.6}
            trigger: {hold: 22, fade_in: 1, fade_out: 6}
      - name: brazo_musculoso
        weight: 0.13
        cooldown: 30
        requires_person: true
        limbs: [left_wrist, right_wrist]
        effects:
          - type: arm_outline
            target: {kind: joint, id: "left_wrist,right_wrist"}
            style: {thickness: 0.01, hdr_gain: 1.5, size: 0.5, min_speed: 0.18, chance: 1.0, boil_frames: 3}
            trigger: {hold: 12, fade_in: 1, fade_out: 5}
      - name: nada
        weight: 0.15

  # Golpe que conecta: llamarada, estrellas (seg. 17.6) o descarga.
  - action: person_contact
    options:
      - name: llamarada
        weight: 0.45
        effects:
          - type: flame_burst
            target: {kind: event_point, id: contact}
            style: {micro_sparks: 45, size: 0.45, hdr_gain: 1.3}
            trigger: {hold: 14, fade_in: 1, fade_out: 6}
          - type: spark_dashes
            target: {kind: event_point, id: contact}
            style: {size: 0.5, thickness: 0.01, hdr_gain: 1.5}
            trigger: {hold: 16, fade_in: 1, fade_out: 6}
      - name: estrellas
        weight: 0.35
        effects:
          - type: stars
            target: {kind: event_point, id: contact}
            style: {micro_sparks: 45, size: 0.5, hdr_gain: 1.6}
            trigger: {hold: 12, fade_in: 1, fade_out: 5}
      - name: descarga
        weight: 0.2
        effects:
          - type: clash
            target: {kind: event_point, id: contact}
            style: {micro_sparks: 45, size: 0.5, hdr_gain: 1.4}
            trigger: {hold: 12, fade_in: 1, fade_out: 6}

  # Choque de puños: energía liberada (seg. 14.7, 21.6, 26.3) o estrellas.
  - action: fist_clash
    options:
      - name: energia
        weight: 0.7
        effects:
          - type: clash
            target: {kind: event_point, id: fist_clash}
            style: {micro_sparks: 45, size: 0.5, hdr_gain: 1.4}
            trigger: {hold: 12, fade_in: 1, fade_out: 6}
      - name: estrellas
        weight: 0.3
        effects:
          - type: stars
            target: {kind: event_point, id: fist_clash}
            style: {micro_sparks: 45, size: 0.45, hdr_gain: 1.6}
            trigger: {hold: 12, fade_in: 1, fade_out: 5}

  # Seg. 7.6-8.9: tras un golpe la pelea se calma y empieza otra ronda. En la pausa, a quien
  # lleva gafas se le encienden (figura al azar). Sin gafas no se inventan.
  - action: lull
    options:
      - name: gafas_ronda
        weight: 0.65
        accessories: [sunglasses, glasses]
        effects:
          - type: eyewear
            target: {kind: joint, id: nose}
            style: {thickness: 0.06, hdr_gain: 1.8, boil_frames: 3,
                    shapes: [frames, stars, hearts, mask, visor, rings, glint]}
            trigger: {hold: 20, fade_in: 3, fade_out: 8}
      - name: nada
        weight: 0.35

  # Seg. 8.1-8.9: cada uno empieza a mover una parte del cuerpo y esa parte se resalta. La
  # figura depende de lo que anuncia el gesto (MotionEvent.kind) y se sortea entre varias.
  - action: intent
    options:
      - name: runa_pecho
        weight: 0.5
        kinds: [hand_to_chest]
        effects:
          - type: intent_mark
            target: {kind: joint, id: right_wrist}
            style: {size: 0.35, thickness: 0.012, hdr_gain: 1.7, boil_frames: 3, shapes: [rune, halo]}
            trigger: {hold: 24, fade_in: 2, fade_out: 8}
      - name: rayos_brazo
        weight: 0.5
        kinds: [arm_back, stir, guard_up]
        effects:
          - type: intent_mark
            target: {kind: joint, id: right_wrist}
            style: {size: 0.35, thickness: 0.011, hdr_gain: 1.7, boil_frames: 2, shapes: [rays, spiral]}
            trigger: {hold: 18, fade_in: 2, fade_out: 6}
      - name: destellos
        weight: 0.2
        effects:
          - type: intent_mark
            target: {kind: joint, id: right_wrist}
            style: {size: 0.3, thickness: 0.01, hdr_gain: 1.7, shapes: [sparkle, halo]}
            trigger: {hold: 16, fade_in: 2, fade_out: 6}
      - name: gafas_intencion
        weight: 0.25
        cooldown: 120
        accessories: [sunglasses, glasses]
        effects:
          - type: eyewear
            target: {kind: joint, id: nose}
            style: {thickness: 0.06, hdr_gain: 1.8, boil_frames: 3, shapes: [stars, mask, visor, glint]}
            trigger: {hold: 20, fade_in: 2, fade_out: 8}
      - name: nada
        weight: 0.15

  # Seg. 9.1: el golpe que sigue a una intención se dibuja como un swoosh en cruz.
  - action: intended_strike
    options:
      - name: cruz
        weight: 0.6
        effects:
          - type: swoosh
            target: {kind: joint, id: "left_wrist,right_wrist"}
            style: {strands: 2, rings: 2, trail_frames: 10, min_speed: 0.1, cross: true, hdr_gain: 1.9}
            trigger: {hold: 10, fade_in: 1, fade_out: 4}
      - name: nada
        weight: 0.4
