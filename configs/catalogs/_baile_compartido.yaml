# Efectos compartidos por los estilos de baile (solista y pareja). Los incluyen el catálogo baile con
# `include:` (director/choreography.py): sus opciones se suman a las de la misma
# acción del catálogo, con el peso multiplicado por el `weight` del include. Leídos de la
# referencia video_34 (docs/referencias/video_34.md); dibujos en engine/duo_doodles.py y
# engine/duo_fx.py. Funcionan con una persona o con dos.
reactions:
- action: spotlight
  options:
  # video_52: ojos en X (cuatro veces en el video) y en "+".
  - name: ojos_x
    weight: 0.15
    kinds: [head]
    cooldown: 300
    effects:
    - type: eyewear
      target: {kind: joint, id: nose}
      style: {thickness: 0.07, shapes: [x_eyes]}
      trigger: {hold: 10, fade_in: 1, fade_out: 6}
  - name: ojos_mas
    weight: 0.1
    kinds: [head]
    cooldown: 300
    effects:
    - type: eyewear
      target: {kind: joint, id: nose}
      style: {thickness: 0.07, shapes: [plus_eyes]}
      trigger: {hold: 10, fade_in: 1, fade_out: 6}
  # video_52 explicado (docs/referencias/video_52.md): dibujos que se convierten en otros (engine/morph_fx.py).
  - name: cuernos_a_x
    weight: 0.18
    cooldown: 450
    kinds: [head]
    effects:
    - type: adornment
      style: {shapes: [horns_morph], thickness: 0.008, focus: false}
      trigger: {hold: 30, fade_in: 1, fade_out: 6}
  - name: manos_eco
    weight: 0.18
    cooldown: 300
    kinds: [left_arm, right_arm]
    effects:
    - type: adornment
      style: {shapes: [hand_echo], thickness: 0.008, focus: false}
      trigger: {hold: 20, fade_in: 1, fade_out: 6}
  - name: corbata_puesta
    weight: 0.15
    cooldown: 450
    kinds: [torso]
    effects:
    - type: adornment
      style: {shapes: [tie_on], thickness: 0.008, focus: false}
      trigger: {hold: 20, fade_in: 1, fade_out: 6}
  - name: cintas
    weight: 0.25
    cooldown: 300
    kinds: [torso, head]
    effects:
    - type: adornment
      style: {shapes: [orbit_ribbons], thickness: 0.008, focus: false}
      trigger: {hold: 30, fade_in: 1, fade_out: 6}
  - name: cintas_reloj
    weight: 0.15
    cooldown: 450
    kinds: [left_arm, right_arm]
    effects:
    - type: adornment
      style: {shapes: [ribbon_watch], thickness: 0.008, focus: false}
      trigger: {hold: 36, fade_in: 1, fade_out: 6}
  - name: cadena_energia
    weight: 0.12
    cooldown: 450
    kinds: [torso]
    effects:
    - type: adornment
      style: {shapes: [energy_chain], thickness: 0.008, focus: false}
      trigger: {hold: 36, fade_in: 1, fade_out: 6}
  # video_41 (docs/referencias/video_41.md): brazos, cabeza y partes pintadas.
  - name: linea_cierre
    weight: 0.15
    cooldown: 300
    kinds: [left_arm, right_arm]
    effects:
    - type: adornment
      style: {shapes: [zipper_line], thickness: 0.008, focus: false}
