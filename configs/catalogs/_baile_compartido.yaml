# Efectos compartidos por los estilos de baile (solista y pareja). Los incluyen el catálogo baile con
# `include:` (director/choreography.py): sus opciones se suman a las de la misma
# acción del catálogo, con el peso multiplicado por el `weight` del include. Leídos de la
# referencia video_34 (docs/referencias/video_34.md); dibujos en engine/duo_doodles.py y
# engine/duo_fx.py. Funcionan con una persona o con dos.
reactions:
- action: spotlight
  options:
  # Piernas (seg. 23.5-26.5, 33-34.8): puntos en las rodillas, banda en el tobillo con una línea
  # que sube por la pierna, o tramos del contorno que suben como una onda.
  - name: rodillas
    weight: 0.4
    kinds: [legs, feet]
    effects:
    - type: adornment
      style: {shapes: [knee_dots]}
      trigger: {hold: 8, fade_in: 2, fade_out: 6}
  - name: tobillos
    weight: 0.35
    kinds: [legs, feet]
    effects:
    # Seg. 33-34.8: bandas en el tobillo y una tira desde ellas hasta la mano.
    - type: adornment
      style: {shapes: [ankle_bands], thickness: 0.035}
      trigger: {hold: 6, fade_in: 2, fade_out: 6}
    - type: adornment
      style: {shapes: [leg_string], thickness: 0.012}
      trigger: {hold: 6, fade_in: 2, fade_out: 6}
  # Brazos (seg. 5.5-6.5, 19.5-21.2): la música sale de las manos, notas o corazones.
  - name: notas
    weight: 0.45
    kinds: [left_arm, right_arm]
    cooldown: 120
    effects:
    - type: droplets
      target: {kind: joint, id: 'left_wrist,right_wrist'}
      style: {thickness: 0.008, hdr_gain: 1.2, size: 0.9, min_speed: 0.15, chance: 1.0, stream: true, shapes: [beamed, note, beamed]}
      trigger: {hold: 10, fade_in: 1, fade_out: 10}
  - name: corazones
    weight: 0.35
    kinds: [left_arm, right_arm]
    cooldown: 120
    effects:
    - type: droplets
      target: {kind: joint, id: 'left_wrist,right_wrist'}
      style: {thickness: 0.008, hdr_gain: 1.2, size: 1.4, min_speed: 0.15, chance: 1.0, stream: true, shapes: [heart]}
      trigger: {hold: 10, fade_in: 1, fade_out: 10}
  # Seg. 11, 15: tramos del contorno que recorren el brazo, o aros que suben hasta el hombro.
  - name: brazo_onda
    weight: 0.3
    kinds: [left_arm, right_arm]
    cooldown: 90
    effects:
    - type: body_glow
      style: {shapes: [wave], trail_frames: 16, fill: 0.0}
      trigger: {hold: 4, fade_in: 2, fade_out: 6}
  - name: saco
    weight: 0.3
    kinds: [torso]
    cooldown: 240
    effects:
    # El borde real del saco (silueta), con guiones de costura dentro (seg. 10.3, 28).
    - type: body_glow
      target: {kind: joint, id: jacket}
      style: {fill: 0.0}
      trigger: {hold: 8, fade_in: 3, fade_out: 8}
  # Seg. 10.3: se abre el saco: la solapa con un tinte suave y costuras dentro.
  - name: solapa_abierta
    weight: 0.12
    kinds: [torso]
    cooldown: 300
    effects:
    - type: body_glow
      target: {kind: joint, id: jacket}
      style: {shapes: [flap, stitches], fill: 0.12}
      trigger: {hold: 8, fade_in: 3, fade_out: 8}
  - name: ojos
    weight: 0.25
    kinds: [head]
    effects:
    - type: adornment
      style: {shapes: [glow_eyes], thickness: 0.01}
      trigger: {hold: 8, fade_in: 3, fade_out: 8}
  # Seg. 18: al girar, el faldón del saco se enciende.
  - name: faldon
    weight: 0.12
    kinds: [torso, legs]
    cooldown: 240
    effects:
    - type: body_glow
      target: {kind: joint, id: jacket}
      style: {shapes: [hem], fill: 0.0}
      trigger: {hold: 6, fade_in: 2, fade_out: 6}
  # Dibujos de la referencia (engine/duo_doodles.py), cada uno en su parte.
  - name: rayos_brazos
    weight: 0.2
    kinds: [left_arm, right_arm, torso]
