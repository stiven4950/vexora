  # Zapatos dibujados encima de los del video (tenis, bota, vaquera, patín...), y al mover el pie
  # salen partículas. Cada movimiento sortea una figura; con temporada,
  # las figuras son las de la temporada (director/seasons.py reemplaza las de droplets).
  - name: zapatos
    weight: 0.2
    kinds: [legs, feet]
    cooldown: 240
    effects:
    # Cada vez, un estilo de zapato dibujado (engine/shoes.py).
    - type: adornment
      style: {shapes: [sneaker, hightop, combat_boot, cowboy_boot, roller_skate, winged_shoe], thickness: 0.008}
      trigger: {hold: 30, fade_in: 3, fade_out: 8}
    - type: droplets
      # Desde el tobillo (la velocidad se mide ahí), justo sobre el zapato. 0.04: el 10-25% de los
      # cuadros más rápidos del pie en video_33 y video_34.
      target: {kind: joint, id: 'left_ankle,right_ankle'}
      style: {thickness: 0.008, hdr_gain: 1.8, size: 1.1, min_speed: 0.04, chance: 0.85, shapes: [star, heart, note, ring, leaf, curl, flake, drop]}
      trigger: {hold: 30, fade_in: 1, fade_out: 10}
