# Baile en solitario (referencia glowing/video_33.mp4). Cada tramo de ~1 s se enciende la parte
# del cuerpo que más se mueve (spotlight): tinte de color pegado a la silueta, línea casi blanca y
# halo, a veces con abdominales o bíceps dibujados. En las pausas aparecen accesorios dibujados
# (collar, estrellas en el pecho, gorra, sombrero, audífonos, gafas). El color cambia por tramo.
# Ver docs/catalogo_efectos.md, sección "Baile".
name: baile_neon
title: Baile neón
description: 'Lo que más se mueve se enciende: brazos, torso, piernas o pies teñidos de neón, abdominales dibujados, collares, estrellas en el
  pecho y sombreros.'
seed: 33
# La gorra que pasa de mano en mano (seg. 0-9 de la referencia) es el objeto protagonista: se
# sigue con Grounding DINO + SAM 2 (lento: ~1,2 s por fotograma en MPS, queda en caché).
needs: [props]
prop: a baseball cap. a hat.
# Color por capítulo (como la referencia): gorra y parte del cuerpo encendida comparten color, y
# el color solo cambia cuando cambia el foco.
chapters: true
# Nada compite con el protagonista: lo que no está en foco se apaga (línea de atención).
attention: true
defaults:
  type: body_glow
  target: {kind: joint, id: body}
  time: {start_frame: 0, end_frame: -1, fade_in: 2, fade_out: 4}
  style:
    thickness: 0.018
    hdr_gain: 1.7
    boil_frames: 3
    fill: 0.6
    palette:
    - [0.35, 1.0, 0.2]
    - [1.0, 0.25, 0.85]
    - [0.2, 1.0, 0.85]
    - [1.0, 0.92, 0.15]
    - [0.55, 0.35, 1.0]
    - [1.0, 0.45, 0.65]
  render: {blend: add, motion_blur: 0.0, persistence: 0.0, group: glow}
always:
# Seg. 29: en el último segundo todo se disipa en estrellas diminutas donde estaba.
- type: closing_stars
  style: {size: 1.0, hdr_gain: 1.8, focus: false}
# Seg. 26.6-27.4: la gorra lanzada o sacudida deja una mancha grande en forma de coma.
- type: prop_swoosh
  style: {min_speed: 0.09, size: 0.9, trail_frames: 10, palette_every: 30}
# Mientras está en las manos o en el aire, la gorra va teñida y con contorno de neón.
- type: prop_outline
  style: {shapes: [no_outline], fill: 0.85, palette_every: 30}
  render: {blend: tint}
- type: prop_outline
  style: {fill: 0.0, palette_every: 30}
reactions:
- action: spotlight
  options:
  - name: brazo
    weight: 0.6
    kinds: [left_arm, right_arm]
    effects:
    - type: body_glow
      trigger: &id001 {hold: 4, fade_in: 3, fade_out: 6}
      style:
        shapes: [no_outline]
        fill: 0.85
      render: {blend: tint}
    - type: body_glow
      style:
        shapes: [biceps]
        fill: 0.0
      trigger: *id001
  # Pierna entera encendida: poco (criterio P7, mejor trazos parciales).
  - name: piernas
    weight: 0.15
    kinds: [legs, feet]
    effects:
    - type: body_glow
      trigger: &id002 {hold: 4, fade_in: 3, fade_out: 6}
      style:
        shapes: [no_outline]
        fill: 0.85
      render: {blend: tint}
    - type: body_glow
      trigger: *id002
      style: {fill: 0.0}
  - name: torso_abdominales
    weight: 0.3
    kinds: [torso, left_arm, right_arm]
    effects:
    - type: body_glow
      target: &id003 {kind: joint, id: torso}
      trigger: &id004 {hold: 4, fade_in: 3, fade_out: 6}
      style:
        shapes: [no_outline]
        fill: 0.85
      render: {blend: tint}
    - type: body_glow
      target: *id003
      style:
        shapes: [abs]
        fill: 0.0
      trigger: *id004
  # Seg. 14.6: no siempre la caja completa; a veces unas pocas líneas sueltas del pecho. De
  # espaldas, músculos de la espalda o una figura de relleno (seg. 18.6: símbolo radiactivo).
  - name: torso_lineas
    weight: 0.3
    kinds: [torso, left_arm, right_arm]
    effects:
    - type: body_glow
      target: {kind: joint, id: torso}
      style:
        shapes: [abs, partial, lines_only]
        fill: 0.0
      trigger: {hold: 4, fade_in: 3, fade_out: 6}
  # Seg. 15: aros que suben por el brazo casi hasta el hombro y regresan; en las piernas igual.
  - name: aros
    weight: 0.3
    kinds: [left_arm, right_arm, legs]
    effects:
    - type: limb_rings
      style: {rings: 2, trail_frames: 14, thickness: 0.014}
      trigger: {hold: 4, fade_in: 2, fade_out: 5}
  # Seg. 23.9-24.7: no la pierna entera, solo tramos del contorno que suben como una onda.
  - name: piernas_onda
    weight: 0.7
    kinds: [legs, feet]
    effects:
    - type: body_glow
      target: {kind: joint, id: legs}
      style: {shapes: [wave], fill: 0.0, trail_frames: 18}
      trigger: {hold: 6, fade_in: 2, fade_out: 6}
    # Si además el pie barre el piso, deja su mancha (solo pinta al arrastrarse).
    - type: foot_paint
      style: {size: 0.3, trail_frames: 14}
      trigger: {hold: 6, fade_in: 2, fade_out: 6}
  # Seg. 25-26: el pie que barre el piso deja una mancha de pintura que lo sigue y gira.
  - name: pie_pintura
    weight: 0.5
    kinds: [legs, feet]
    effects:
    - type: foot_paint
      style: {size: 0.3, trail_frames: 14}
      trigger: {hold: 8, fade_in: 2, fade_out: 6}
  - name: collar_estrellas
    weight: 0.4
    kinds: [torso]
    effects:
    - type: adornment
      style:
        thickness: 0.016
        shapes: [necklace, chain, chest_stars]
      trigger: {hold: 6, fade_in: 4, fade_out: 8}
  - name: cabeza_accesorio
    weight: 0.5
    kinds: [head]
    # Le cede la cabeza a la gorra recién puesta y a la cara de caricatura (casi siempre).
    yields_to: [prop_worn, face_touch]
    effects:
    - type: adornment
      style:
        thickness: 0.016
        shapes: [cap, cowboy_hat, top_hat, fedora, party_hat, headphones, crown]
      trigger: {hold: 6, fade_in: 4, fade_out: 8}
  # Seg. 28.2: un sombrero lindo con ojos de punto y un cinturón de metal con brillo.
  - name: sombrero_cinturon
    weight: 0.25
    kinds: [head, torso, legs]
    yields_to: [prop_worn, face_touch]
    effects:
    - type: adornment
      style: {thickness: 0.016, shapes: [cowboy_hat, top_hat, fedora, party_hat], focus: false}
      trigger: &sombrero {hold: 20, fade_in: 4, fade_out: 8}
    - type: eyewear
      style: {shapes: [dots], thickness: 0.08, focus: false}
      trigger: *sombrero
    - type: adornment
      style: {thickness: 0.016, shapes: [belt], focus: false}
      trigger: *sombrero
  - name: cabeza_gafas
    weight: 0.3
    kinds: [head]
    # Le cede la cabeza a la gorra recién puesta y a la cara de caricatura (casi siempre).
    yields_to: [prop_worn, face_touch]
    effects:
    - type: eyewear
      target: {kind: joint, id: nose}
      style:
        thickness: 0.07
        shapes: [frames, glint, hearts, stars, visor]
      trigger: {hold: 6, fade_in: 3, fade_out: 8}
  - name: cabeza_brillo
    weight: 0.3
    kinds: [head]
    # Le cede la cabeza a la gorra recién puesta y a la cara de caricatura (casi siempre).
    yields_to: [prop_worn, face_touch]
    effects:
    - type: body_glow
      target: &id005 {kind: joint, id: head}
      trigger: &id006 {hold: 4, fade_in: 3, fade_out: 6}
      style:
        shapes: [no_outline]
        fill: 0.85
      render: {blend: tint}
    - type: body_glow
      target: *id005
      trigger: *id006
      style: {fill: 0.0}
  - name: silueta_completa
    weight: 0.06
    effects:
    - type: body_glow
      target: &id007 {kind: joint, id: body}
      trigger: &id008 {hold: 2, fade_in: 2, fade_out: 6}
      style:
        shapes: [no_outline]
        fill: 0.85
      render: {blend: tint}
    - type: body_glow
      target: *id007
      style:
        shapes: [abs]
        fill: 0.0
      trigger: *id008
  - name: nada
    weight: 0.12
    effects: []
- action: prop_transfer
  options:
  # Seg. 0.6-1.3 de la referencia: un resorte une la gorra con la mano que la recibe; se estira
  # cuando la mano se aleja y se comprime cuando la gorra llega.
  - name: resorte
    weight: 0.7
    effects:
    - type: prop_spring
      style: {rings: 5, size: 0.16, palette_every: 30}
      trigger: {lead: 10, hold: 2, fade_in: 3, fade_out: 4}
  - name: doble_contorno
    weight: 0.3
    effects:
    - type: prop_outline
      style: {shapes: [double], fill: 0.0, palette_every: 30}
      trigger: {hold: 6, fade_in: 1, fade_out: 5}
- action: prop_spin
  options:
  # Seg. 2.3-3.4 de la referencia: mientras gira la gorra en las manos, un anillo la recorre
  # subiendo (color principal) y bajando (acento).
  - name: anillos
    weight: 0.8
    effects:
    - type: prop_rings
      style: {rings: 1, trail_frames: 12, palette_every: 30}
      trigger: {hold: 4, fade_in: 3, fade_out: 5}
    # El resplandor del color sobre la gorra mientras gira (sin contorno).
    - type: prop_outline
      style: {shapes: [no_outline, spin], fill: 0.5, palette_every: 30}
      render: {blend: tint}
      trigger: {hold: 4, fade_in: 3, fade_out: 5}
    # Seg. 3.3-4.1: al terminar de girar, a la gorra le sale una oreja puntiaguda y un corazoncito.
    - type: prop_doodle
      style: {shapes: [horn, heart], palette_every: 30}
      trigger: {anchor: end, hold: 22, fade_in: 2, fade_out: 6}
  - name: nada
    weight: 0.2
    effects: []
- action: prop_worn
  options:
  - name: gorra_puesta
    weight: 1.0
    effects:
    - type: prop_outline
      style: {shapes: [double, worn], fill: 0.0, palette_every: 30}
      # Corto: en la referencia la gorra deja de dibujarse ~1 s después de ponérsela.
      trigger: {hold: 6, fade_in: 2, fade_out: 8}
    # Seg. 6.9-7.2 ("ajustado"): con la gorra recién puesta, la cara teñida y dibujada como
    # caricatura (mandíbula, orejas, ojos de punto, nariz y boca).
    - type: face_toon
      style: {shapes: [tint], fill: 0.75, palette_every: 30}
      render: {blend: tint}
      trigger: {hold: 6, fade_in: 2, fade_out: 8}
    - type: face_toon
      style: {shapes: [caricature], palette_every: 30}
      trigger: {hold: 6, fade_in: 2, fade_out: 8}
- action: face_touch
  options:
  # Seg. 8.2-9.2: la mano en la cara la vuelve caricatura (ojos con pestañas, labios de beso) y,
  # al apartarse, los labios viajan hasta los dedos y los ojos se estiran ("jalón").
  - name: beso
    weight: 1.0
    effects:
    - type: face_toon
      style: {shapes: [tint], fill: 0.8, palette_every: 30}
      render: {blend: tint}
      trigger: &beso {lead: 8, hold: 10, fade_in: 3, fade_out: 4}
    - type: face_toon
      style: {shapes: [kiss], palette_every: 30}
      trigger: *beso
- action: frenzy
  options:
  # Mucho movimiento de todo el cuerpo: modo discoteca (destellos disparados y haces de luz) o
  # un ecualizador en el piso que salta con la música.
  - name: discoteca
    weight: 0.6
    effects:
    - type: disco_fx
      style: {focus: false, hdr_gain: 1.8, palette_every: 30}
      trigger: {hold: 8, fade_in: 3, fade_out: 10}
  - name: ecualizador
    weight: 0.3
    effects:
    - type: equalizer
      style: {focus: false, hdr_gain: 1.6, palette_every: 30}
      trigger: {hold: 30, fade_in: 4, fade_out: 10}
  - name: nada
    weight: 0.1
    effects: []
- action: beat
  cooldown: 12
  options:
  # De vez en cuando, la silueta late justo en el golpe de la música.
  - name: pulso
    weight: 0.2
    effects:
    - type: beat_pulse
      style: {thickness: 0.012, focus: false, palette_every: 30}
      trigger: {hold: 6, fade_in: 0, fade_out: 6}
  - name: nada
    weight: 0.8
    effects: []
- action: stomp
  cooldown: 90
  options:
  # Seg. 28.2: el pie que pisa revienta un globo (chispas y aire). De vez en cuando.
  - name: globo
    weight: 0.35
    effects:
    - type: pop_fx
      # El pisotón no mueve la atención (se detecta en muchos pasos); el globo, cuando sale, se ve.
      style: {thickness: 0.012, palette_every: 30, focus: false}
      trigger: {hold: 14, fade_in: 2, fade_out: 4}
  - name: nada
    weight: 0.65
    effects: []
- action: throw
  options:
  # Seg. 10.0-11.2: carga una bola de energía en la mano en alto y la suelta de golpe. Al soltar:
  # sale volando y revienta, un rayo en la dirección del lanzamiento o una explosión.
  - name: energia
    weight: 0.85
    effects:
    - type: throw_fx
      style: {shapes: [orb, ray, burst], thickness: 0.014, palette_every: 30}
      trigger: {hold: 22, fade_in: 3, fade_out: 4}
  - name: nada
    weight: 0.15
    effects: []
- action: neck_slash
  options:
  # Seg. 11.7-13.0: la mano cruza el cuello ("ya valió"): ojos en X y después unas gafas, con la
  # cara teñida.
  - name: ya_valio
    weight: 1.0
    effects:
    - type: eyewear
      style: {shapes: [x_eyes], thickness: 0.08, palette_every: 30}
      trigger: {hold: 8, fade_in: 1, fade_out: 4}
    - type: eyewear
      style: {shapes: [frames, visor, glint], thickness: 0.08, palette_every: 30}
      trigger: {anchor: end, hold: 36, fade_in: 6, fade_out: 8}
    - type: face_toon
      style: {shapes: [tint], fill: 0.6, palette_every: 30}
      render: {blend: tint}
      trigger: {hold: 40, fade_in: 3, fade_out: 8}
- action: still
  cooldown: 60
  options:
  - name: accesorio
    weight: 0.5
    effects:
    - type: adornment
      style:
        thickness: 0.016
        shapes: [necklace, chain, chest_stars, cap, cowboy_hat, top_hat, fedora, party_hat]
      trigger: {hold: 20, fade_in: 4, fade_out: 8}
  - name: nada
    weight: 0.5
    effects: []
- action: fast_swing
  options:
  - name: estela
    weight: 0.3
    limbs: [left_wrist, right_wrist]
    effects:
    - type: swoosh
      target: {kind: joint, id: 'left_wrist,right_wrist'}
      style: {strands: 1, trail_frames: 10, min_speed: 0.18, thickness: 0.03, paint_chance: 0.6, paint_width: 0.25}
      trigger: {hold: 8, fade_in: 1, fade_out: 5}
  - name: nada
    weight: 0.7
    effects: []
