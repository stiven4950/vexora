# Maquillaje y revelado (referencia glowing/video_2.mp4; ver docs/referencias/video_2.md).
# Escena de pintura: la luz sigue al pincel (contorno de la pintura nueva que se dibuja y se
# deshace, punto caliente en la punta). Escena de la obra terminada: trazos cortos sobre sus
# líneas pintadas, una zona y un color a la vez, y chispas que suben con el humo. Cada efecto
# solo dibuja donde el análisis encontró su dato (pintura o acentos), así que se reparten las
# escenas solos.
